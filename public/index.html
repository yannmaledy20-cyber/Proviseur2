<title>Proviseur</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: a blackboard band (school identity, key figures, school-year timeline) over a working sheet with tabs; decisions open as official forms. */
:root{
  --paper:#e9eee9; --sheet:#fbfcfa; --ink:#17231e; --muted:#56675f; --line:#d0d9d3; --soft:#f1f4f1;
  --board:#1e3832; --board-2:#284840; --chalk:#eaf0eb; --chalk-dim:#a3b8ae;
  --accent:#d4951a; --accent-ink:#1d1504; --accent-soft:#f6e6c3;
  --red:#b3302a; --green:#23744a; --blue:#2b5b8c;
  --f-display:"Zilla Slab", Rockwell, "Roboto Slab", Georgia, serif;
  --f-body:"IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0f1613; --sheet:#151e1a; --ink:#e3ebe6; --muted:#93a59c; --line:#2a3832; --soft:#1a2520;
  --board:#0b1210; --board-2:#16231e; --chalk:#e6eee8; --chalk-dim:#8aa197;
  --accent:#eab040; --accent-ink:#1d1504; --accent-soft:#3a2e14;
  --red:#ee6f62; --green:#5cc489; --blue:#7fb0e3; color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#0f1613; --sheet:#151e1a; --ink:#e3ebe6; --muted:#93a59c; --line:#2a3832; --soft:#1a2520;
  --board:#0b1210; --board-2:#16231e; --chalk:#e6eee8; --chalk-dim:#8aa197;
  --accent:#eab040; --accent-ink:#1d1504; --accent-soft:#3a2e14;
  --red:#ee6f62; --green:#5cc489; --blue:#7fb0e3; color-scheme:dark }
html,body{min-height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
*{box-sizing:border-box}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
h2{font-size:1.35rem}
h3{font-size:1.08rem}
p{margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.rouge{color:var(--red)}
.vert{color:var(--green)}
.small{font-size:.84rem}
.eyebrow{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;font-weight:600}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--sheet);color:var(--ink);padding:.45rem .8rem;border-radius:6px;font-weight:500;font-size:.88rem}
.btn:hover{border-color:var(--muted)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary:hover{filter:brightness(1.05)}
.btn.danger{color:var(--red)}
.btn.sm{padding:.25rem .55rem;font-size:.8rem}
input[type=number],input[type=text],select,textarea{font:inherit;color:var(--ink);background:var(--sheet);border:1px solid var(--line);border-radius:6px;padding:.4rem .55rem}
input[type=range]{width:100%;accent-color:var(--accent)}
input[type=checkbox]{accent-color:var(--accent);width:1.05rem;height:1.05rem}

/* Blackboard band */
.board{background:var(--board);color:var(--chalk);padding-block:18px 0}
.board-in{display:flex;flex-wrap:wrap;gap:16px 28px;align-items:flex-end;justify-content:space-between}
.board .eyebrow{color:var(--chalk-dim)}
.board h1{font-size:clamp(1.6rem,4vw,2.3rem);font-weight:700;letter-spacing:.005em}
.board .sub{color:var(--chalk-dim);font-size:.9rem}
.kpis{display:flex;flex-wrap:wrap;gap:6px 22px}
.kpi{display:flex;flex-direction:column;min-width:0}
.kpi .eyebrow{font-size:.66rem}
.kpi b{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:1.08rem;font-weight:500}
.kpi b.neg{color:#ff8f84}
.board .menu{display:flex;gap:8px}
.board .btn{background:transparent;color:var(--chalk);border-color:rgba(234,240,235,.25)}
.board .btn:hover{border-color:var(--chalk)}
.timeline{display:flex;gap:2px;overflow-x:auto;margin-top:16px;padding-bottom:0;scrollbar-width:thin}
.tl{flex:1 0 74px;padding:7px 8px 9px;background:var(--board-2);border-top:3px solid transparent;font-size:.72rem;line-height:1.25;color:var(--chalk-dim)}
.tl b{display:block;font-weight:500;color:var(--chalk);font-size:.75rem}
.tl.done{opacity:.5}
.tl.now{border-top-color:var(--accent);background:var(--sheet);color:var(--muted)}
.tl.now b{color:var(--ink);font-weight:600}
.tl.exam b::after{content:" ✎"}

/* Next-step band */
.action{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;background:var(--sheet);border:1px solid var(--line);border-top:0;padding:16px 18px;margin-bottom:18px}
.action .what{min-width:0;flex:1 1 320px}
.action h2{font-size:1.25rem}
.action .last{font-size:.86rem;color:var(--muted);margin-top:4px}
.action .btn.primary{font-size:1rem;padding:.65rem 1.2rem}

.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:18px}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:.55rem .8rem;color:var(--muted);font-weight:500;white-space:nowrap}
.tab[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent)}
.tab .badge{display:inline-block;min-width:1.2em;padding:0 .3em;margin-left:.3em;border-radius:9px;background:var(--red);color:#fff;font-size:.7rem;text-align:center}

.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:8px;padding:16px;min-width:0}
.card h3{margin-bottom:10px}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.between{justify-content:space-between}
.meter{height:8px;background:var(--soft);border-radius:4px;overflow:hidden;border:1px solid var(--line)}
.meter i{display:block;height:100%;background:var(--green)}
.meter i.mid{background:var(--accent)}
.meter i.low{background:var(--red)}
.chip{display:inline-block;font-size:.72rem;padding:.08rem .45rem;border-radius:4px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.ok{color:var(--green);border-color:currentColor}
.chip.bad{color:var(--red);border-color:currentColor}
.chip.warn{color:var(--accent);border-color:currentColor}
.scroll{overflow-x:auto;max-width:100%}
table.tbl{border-collapse:collapse;width:100%;font-size:.86rem}
.tbl th{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;text-align:left;padding:.4rem .5rem;border-bottom:2px solid var(--line);white-space:nowrap}
.tbl td{padding:.38rem .5rem;border-bottom:1px solid var(--line);vertical-align:top}
.tbl td.n,.tbl th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--soft)}
.tbl tr.me td{background:var(--accent-soft);font-weight:600}
.tbl tfoot td{font-weight:600;border-top:2px solid var(--line)}
.journal li{padding:.35rem 0;border-bottom:1px solid var(--line);font-size:.88rem;list-style:none}
.journal{padding:0;margin:0}
.journal .d{font-family:var(--f-mono);font-size:.74rem;color:var(--muted);margin-right:.5rem}
.journal .bad{color:var(--red)}
.journal .good{color:var(--green)}
.obj li{list-style:none;padding:.3rem 0;display:flex;gap:.6rem;font-size:.9rem}
.obj{padding:0;margin:0}
.obj .box{flex:0 0 1.1rem;height:1.1rem;border:1.5px solid var(--muted);border-radius:3px;display:grid;place-items:center;font-size:.75rem;margin-top:.15rem}
.obj .done .box{background:var(--green);border-color:var(--green);color:#fff}
.obj .done span:last-child{color:var(--muted);text-decoration:line-through}
.obj .cur span:last-child{font-weight:600}
.build{display:flex;flex-direction:column;gap:8px}
.build .cost{font-family:var(--f-mono);font-size:.9rem}
.bars{display:flex;flex-direction:column;gap:4px}
.bar{display:grid;grid-template-columns:7.5rem 1fr 2.5rem;gap:8px;align-items:center;font-size:.82rem}
.bar .track{height:10px;background:var(--soft);border-radius:3px;overflow:hidden}
.bar .track i{display:block;height:100%;background:var(--blue)}
.stars{color:var(--accent);letter-spacing:.05em;white-space:nowrap}
.note{font-size:.82rem;color:var(--muted);border-left:3px solid var(--line);padding-left:.6rem}

/* Modal = official form */
.overlay{position:fixed;inset:0;background:rgba(10,18,15,.55);display:flex;align-items:flex-start;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) 16px 16px;overflow-y:auto;z-index:20}
.form{background:var(--sheet);color:var(--ink);width:100%;max-width:860px;border-radius:8px;border:1px solid var(--line);box-shadow:0 18px 50px rgba(0,0,0,.3);margin-block:24px}
.form header{padding:16px 20px 12px;border-bottom:1px solid var(--line)}
.form header .eyebrow{color:var(--muted)}
.form header h2{margin-top:2px}
.form .body{padding:16px 20px;display:flex;flex-direction:column;gap:14px}
.form footer{padding:12px 20px 16px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.choice{display:flex;flex-direction:column;gap:8px}
.choice .btn{text-align:left;padding:.7rem .9rem;font-size:.92rem}
.pool{border:1px solid var(--line);border-radius:6px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.bulhead{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;text-align:center;color:var(--muted);border-bottom:1px dashed var(--line);padding-bottom:10px}
.devise{font-style:italic;text-transform:none;letter-spacing:0}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{border:1px solid var(--line);border-radius:6px;padding:8px 10px}
.stat .eyebrow{color:var(--muted);font-size:.66rem}
.stat b{display:block;font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:1.15rem;font-weight:500}
textarea.json{width:100%;min-height:260px;font-family:var(--f-mono);font-size:.78rem}

/* Start screen */
.start{max-width:760px;margin:0 auto;padding-block:32px 48px}
.start .hero{background:var(--board);color:var(--chalk);border-radius:8px;padding:26px 24px}
.start .hero h1{font-size:clamp(2.2rem,7vw,3.4rem);font-weight:700}
.start .hero p{color:var(--chalk-dim);max-width:60ch;margin-top:8px}
.start .hero .eyebrow{color:var(--accent)}
.types{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:10px}
.type{border:1.5px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;gap:10px;cursor:pointer;background:var(--sheet)}
.type:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.type input{margin-top:.25rem}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.85rem;font-weight:500}
.loop{counter-reset:s;padding:0;margin:0;display:grid;gap:6px}
.loop li{list-style:none;display:flex;gap:10px;font-size:.9rem}
.loop li::before{counter-increment:s;content:counter(s);font-family:var(--f-mono);color:var(--accent);font-weight:500}
.fig{display:flex;align-items:center;gap:10px;padding:6px;border-radius:6px}
.fig.click{cursor:pointer}
.fig.click:hover{background:var(--soft)}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:600;font-size:.8rem;flex:0 0 36px;letter-spacing:.02em}
.fig-t{display:flex;flex-direction:column;min-width:0;flex:1}
.wit{border:1px dashed var(--line);border-radius:6px;padding:8px 10px;font-size:.9rem}
.axis{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.slots td{vertical-align:middle}
.tl.wk{flex:1 0 36px;padding:5px 3px 7px;text-align:center}
.tl.wk span{display:block;min-height:1.1em;font-size:.66rem}
.tl.wk b{font-size:.72rem;font-family:var(--f-mono)}
.tl.mark b{color:var(--accent)}
.tl.now.mark b{color:var(--accent-ink)}
.tl.now b{color:var(--ink)}
.action.week{flex-direction:column;align-items:stretch}
.weekgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:10px}
fieldset.day{border:1px solid var(--line);border-radius:6px;padding:8px 12px 10px;margin:0;min-width:0}
fieldset.day legend{font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;font-weight:600;color:var(--muted);padding:0 4px}
fieldset.day.fort{border-color:var(--accent);background:var(--accent-soft)}
.opt{display:flex;gap:7px;align-items:flex-start;font-size:.86rem;padding:3px 0;cursor:pointer}
.opt input{margin-top:.2rem}
.opt small{display:block;color:var(--muted);font-size:.76rem}
.pa-btns{display:flex;flex-wrap:wrap;gap:6px}
.pa-dots{letter-spacing:.15em;color:var(--accent)}
.weekfoot{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.dial{display:flex;flex-direction:column;gap:6px}
.dial .q{font-size:.8rem;color:var(--muted)}
.dial .r{border-left:3px solid var(--accent);padding:4px 10px;background:var(--soft);border-radius:0 6px 6px 0;font-size:.9rem}
.msg{border:1px solid var(--line);border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.msg.new{border-color:var(--accent)}
.msg .from{font-size:.74rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.msg .ans{font-size:.86rem;color:var(--muted);border-top:1px dashed var(--line);padding-top:6px}
@media (max-width:560px){.board .menu{width:100%}.action .btn.primary{width:100%}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ===== Habillage couleurs : lycée camerounais, vert-rouge-jaune et ciel tropical ===== */
:root{
 --paper:#f3f6fb;
 --bg-grad:radial-gradient(1100px 620px at 0% 0%,#ffefcc 0%,rgba(255,239,204,0) 60%),radial-gradient(900px 520px at 100% 8%,#d6efff 0%,rgba(214,239,255,0) 58%),radial-gradient(1000px 640px at 40% 100%,#dff6e6 0%,rgba(223,246,230,0) 62%),linear-gradient(180deg,#f8f3ff 0%,#eef7f2 100%);
 --sheet:#ffffff;--ink:#1a2233;--muted:#586377;--line:#e0e5ef;--soft:#f1f4fa;
 --board-grad:linear-gradient(118deg,#065f46 0%,#0f766e 42%,#1d4ed8 100%);--board-2:rgba(255,255,255,.12);--chalk:#f4fbf7;--chalk-dim:#c8ecdd;
 --accent:#f59e0b;--accent-ink:#2a1600;--accent-soft:#fff2d4;--btn-grad:linear-gradient(135deg,#fcd34d 0%,#f97316 100%);

 --c1:#10b981;--c2:#6366f1;--c3:#f97316;--c4:#ec4899;
 --t-blue:#e7efff;--t-blue-ink:#1d4ed8;--t-amber:#fff3d9;--t-amber-ink:#b45309;--t-rose:#ffe7f0;--t-rose-ink:#be185d;
 --t-violet:#f0eaff;--t-violet-ink:#6d28d9;--t-teal:#ddf6f2;--t-teal-ink:#0f766e;--t-green:#e3f7ea;--t-green-ink:#047857;
 --gold:linear-gradient(135deg,#fde68a 0%,#f59e0b 100%);
 --shadow:0 8px 26px rgba(30,45,90,.09);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
 --paper:#0a0f1f;
 --bg-grad:radial-gradient(1000px 600px at 0% 0%,#3b2a08 0%,rgba(59,42,8,0) 60%),radial-gradient(900px 520px at 100% 8%,#0b2e4f 0%,rgba(11,46,79,0) 58%),radial-gradient(1000px 640px at 40% 100%,#0a3524 0%,rgba(10,53,36,0) 62%),linear-gradient(180deg,#0d1226 0%,#08140f 100%);
 --sheet:#131a2e;--ink:#e9edf7;--muted:#9ba7c2;--line:#27314d;--soft:#1a2239;
 --board-grad:linear-gradient(118deg,#022c22 0%,#0b4f4a 42%,#1e2a7a 100%);--board-2:rgba(255,255,255,.08);--chalk:#effaf5;--chalk-dim:#a6dcc8;
 --accent:#fbbf24;--accent-ink:#2a1600;--accent-soft:#3a2b0d;--btn-grad:linear-gradient(135deg,#fcd34d 0%,#fb923c 100%);
 --tab-grad:linear-gradient(135deg,#0d9488 0%,#3b82f6 100%);
 --red:#f87171;--green:#34d399;--blue:#60a5fa;--c1:#34d399;--c2:#a5b4fc;--c3:#fb923c;--c4:#f472b6;
 --t-blue:#14224d;--t-blue-ink:#9dbcff;--t-amber:#38290b;--t-amber-ink:#fcd34d;--t-rose:#3b1428;--t-rose-ink:#f9a8d4;
 --t-violet:#261a4c;--t-violet-ink:#c4b5fd;--t-teal:#0b322f;--t-teal-ink:#5eead4;--t-green:#0c3221;--t-green-ink:#6ee7b7;
 --gold:linear-gradient(135deg,#fcd34d 0%,#d97706 100%);--shadow:0 8px 26px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{
 --paper:#0a0f1f;
 --bg-grad:radial-gradient(1000px 600px at 0% 0%,#3b2a08 0%,rgba(59,42,8,0) 60%),radial-gradient(900px 520px at 100% 8%,#0b2e4f 0%,rgba(11,46,79,0) 58%),radial-gradient(1000px 640px at 40% 100%,#0a3524 0%,rgba(10,53,36,0) 62%),linear-gradient(180deg,#0d1226 0%,#08140f 100%);
 --sheet:#131a2e;--ink:#e9edf7;--muted:#9ba7c2;--line:#27314d;--soft:#1a2239;
 --board-grad:linear-gradient(118deg,#022c22 0%,#0b4f4a 42%,#1e2a7a 100%);--board-2:rgba(255,255,255,.08);--chalk:#effaf5;--chalk-dim:#a6dcc8;
 --accent:#fbbf24;--accent-ink:#2a1600;--accent-soft:#3a2b0d;--btn-grad:linear-gradient(135deg,#fcd34d 0%,#fb923c 100%);
 --tab-grad:linear-gradient(135deg,#0d9488 0%,#3b82f6 100%);
 --red:#f87171;--green:#34d399;--blue:#60a5fa;--c1:#34d399;--c2:#a5b4fc;--c3:#fb923c;--c4:#f472b6;
 --t-blue:#14224d;--t-blue-ink:#9dbcff;--t-amber:#38290b;--t-amber-ink:#fcd34d;--t-rose:#3b1428;--t-rose-ink:#f9a8d4;
 --t-violet:#261a4c;--t-violet-ink:#c4b5fd;--t-teal:#0b322f;--t-teal-ink:#5eead4;--t-green:#0c3221;--t-green-ink:#6ee7b7;
 --gold:linear-gradient(135deg,#fcd34d 0%,#d97706 100%);--shadow:0 8px 26px rgba(0,0,0,.4);color-scheme:dark}
body{background:var(--bg-grad),var(--paper);background-attachment:fixed}
.board{background:var(--board-grad);position:relative;padding-top:24px;box-shadow:0 10px 34px rgba(6,40,30,.28)}
.board::before{content:"";position:absolute;left:0;right:0;top:0;height:6px;background:linear-gradient(90deg,#16a34a 0 33.33%,#dc2626 33.33% 66.66%,#facc15 66.66% 100%)}
.board .kpi{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);border-radius:12px;padding:6px 12px}
.board .kpi b.neg{color:#fecaca}
.board .btn{border-color:rgba(255,255,255,.3);border-radius:999px}
.tl{background:var(--board-2);color:var(--chalk-dim);border-top:0;border-radius:8px 8px 0 0}
.tl.done{opacity:.55}
.tl.now{background:var(--btn-grad);color:var(--accent-ink)}

function formerClasses(){

 for(const e of S.eleves){const k=gkey(e.level,e.serie);(groups[k]||(groups[k]={k,level:e.level,serie:e.serie,list:[]})).list.push(e);}

 while(sum(plan.map(p=>p.d))>rooms){
  const c=plan.filter(p=>p.d>1);if(!c.length)break;
  c.sort((a,b)=>a.list.length/(a.d-1)-b.list.length/(b.d-1));c[0].d--;
 }

 for(const p of plan){
  const divs=[];
  for(let i=0;i<p.d;i++) divs.push({nom:p.serie?`${p.level} ${p.serie}${i+1}`:anglo(p.level)?`${p.level}${String.fromCharCode(65+i)}`:`${p.level} M${i+1}`,key:p.k,level:p.level,serie:p.serie,ids:[]});
  const sh=[...p.list].sort((a,b)=>b.base-a.base);
  sh.forEach((e,i)=>{const r=Math.floor(i/p.d)%2?p.d-1-i%p.d:i%p.d;const d=divs[r];d.ids.push(e.id);e.div=d.nom;});
  const nm=Object.fromEntries(p.list.map(e=>[e.id,e.nom]));
  divs.forEach(d=>d.ids.sort((a,b)=>nm[a].localeCompare(nm[b])));
  S.divisions.push(...divs);

function affecter(){

 divs.forEach(d=>S.affect[d.nom]={});
 for(const s in MATIERES){
  const profs=S.profs.filter(p=>p.mat===s).sort((a,b)=>b.q-a.q);
  for(const d of divs){
   if(!(s in coefsOf(d.key))) continue;
   const p=profs.find(p=>load[p.id]<p.cap);
   if(p){S.affect[d.nom][s]=p.id;load[p.id]++;}
  }
 }
 S.load=load;
}
function couverture(){

  const o=by[s]||(by[s]={need:0,cov:0});o.need++;need++;
  if(S.affect[d.nom]?.[s]!=null){o.cov++;cov++;}

}

function passerExamen(e,off,pm,fr){
 const coefs=coefsOf(gkey(e.level,e.serie));const notes={};
 const prep=Math.min(1.1,(S.bat.amphi?.2:0)+(off&&S.prep.soutien?.5:0)+(S.soutien?.25:0)+(S.prepAnnee||0));
 const triche=!!fr;
 const fuite=off&&S.flags.fuite==='vraie';const jourJ=gauss(-.25,1.25);
 for(const s in coefs){
  let n=e.base+e.apt[s]+.8*effProf(pm,e.div,s)+infra(s)+prep+bonusGestion()*.7+(e.assid-.8)*3-(e.abs>90?.5:0)-1.1+gauss(0,2.5);
  if(triche&&R()<.4) n+=gauss(2.5,.8);
  if(fuite) n+=2.5;
  n=compresser(n+difficulteExamen(e,s,off)+jourJ);
  notes[s]=q4(clamp(n,0,20));
 }
 const moy=moyW(notes,coefs);
 const fraude=triche;
 const gce=gceNotes(e.level,notes);const admis=!fraude&&(gce?gce.admis:moy>=10);
 return {moy,admis,fraude,mention:admis?(gce?`${gce.n} papers`:mention(moy)):null,gce:gce?gce.g:null,papers:gce?gce.n:null,notes};
}
function agreger(off){

 }

  if(e.fig&&['oriente','parti','exclu','abandon'].includes(fate)) log(`${e.nom} (${FIG[e.fig.t].l}) quitte l’établissement : ${({oriente:'orienté·e vers un autre lycée',parti:'sans place après un second échec',exclu:'exclu·e',abandon:'abandon'})[fate]}.`,'bad');
  if(fate==='bachelier'){out.bacheliers++;if(e.fig||e.star)ancien(e);continue;}
  if(e.star&&!e.fig&&['oriente','parti','exclu','abandon'].includes(fate)) log(`★ ${e.nom} quitte l’établissement (${({oriente:'orientation',parti:'second échec',exclu:'exclusion',abandon:'abandon'})[fate]}).`,'bad');
  if(fate==='oriente'){out.orientes++;continue;}
  if(fate==='parti'){out.partis++;continue;}
  if(fate==='exclu'){out.exclus++;continue;}
  if(fate==='abandon'){out.abandons++;continue;}
  e.age++;e.abs=0;e.notes=[{},{},{},{},{},{}];e.trim=[null,null,null];e.rangs=[null,null,null];e.annuelle=null;e.decision=null;e.examen=null;
  keep.push(e);
 }

 // Personnel

  if(p.statut!=='fonctionnaire'&&p.motiv<35&&R()<.4){partis.push(`${p.nom} (démission)`);return false;}

 });

 }

 S.annee++;S.phase=0;S.coupe={};S.gouv=null;S.rattrap={};S.ledger=[];S.semaine=0;S.pa=PA_MAX;S.acc=accVide();S.paradeQ=0;S.ossucam=0;S.prepAnnee=0;S.mois=null;S.prep={soutien:false,sensib:false};
 S.flags={};
 S.evUsed=[];S.actions={seminaire:false,demande:false,fav:{},vis:{}};S.recoursFait=false;S.recoursMsg='';S.seqFaites=0;S.trimFaits=0;
 S.divisions.forEach(d=>d.ids=[]);
 S.pending=null;
 formerClasses();affecter();genMarche();
 log(`Nouvelle année scolaire ${S.annee}–${S.annee+1}. Départs : ${out.bacheliers} bacheliers, ${out.orientes} orientés vers d’autres établissements, ${out.partis+out.exclus} exclus ou sans place, ${out.abandons} abandons. ${out.redoublants} redoublants.`);
 if(partis.length) log(`Départs d’enseignants : ${partis.join(', ')}.`,'bad');
 if(arrives.length) log(`Nouvelles affectations du MINESEC : ${arrives.join(', ')}.`,'good');
 S.derniere=`Vacances terminées. Préparez la rentrée : recrutements, frais, salles.`;
 save();render();
}

/* ================= Finances ================= */
function financesMois(mk){
 const m=1,eff=S.eleves.length,i={sept:0,janv:4,mars:6,avr:7}[mk]??-1;
 if(S.type==='prive'){
  const tr={0:.5,4:.3,7:.2}[i];
  if(tr){const tot=sum(S.eleves.map(fraisEleve))*tr*recouvrement();mvt(`Scolarités – ${i===0?'1re':i===4?'2e':'3e'} tranche`,tot);}
 }else{
  if(i===0) mvt('Frais d’APEE',eff*S.frais*recouvrement());
  if(i===0||i===6) mvt(`Budget de fonctionnement (État) – ${i===0?'1re':'2e'} tranche`,800000+2500*eff);
 }
 if(m>0){
  const sal=sum(S.profs.filter(p=>p.statut!=='fonctionnaire').map(p=>p.sal))*m;
  if(sal>0){
   if(S.tresor<sal){S.profs.forEach(p=>{if(p.statut!=='fonctionnaire')p.motiv=clamp(p.motiv-10,0,100);});log('Salaires versés en retard faute de trésorerie : le moral des enseignants baisse.','bad');}
   mvt('Salaires des enseignants',-sal);
  }
  if(S.surveillants) mvt('Surveillants',-S.surveillants*45000*m);
  const primes=sum(S.profs.map(p=>p.prime||0))*m;if(primes) mvt('Primes de fidélisation',-primes);
  mvt('Fonctionnement (registres, eau, électricité)',-(40000+200*eff)*m);
  if(S.budget.peda) mvt('Pédagogie : manuels, craie, consommables',-S.budget.peda*m);
  if(S.budget.entretien) mvt('Entretien des bâtiments',-S.budget.entretien*m);
  if(S.budget.social) mvt('Social : cantine et bourses',-S.budget.social*m);
  const cc=sum(CLUBS.filter(c=>S.clubs?.[c.k]).map(c=>c.c));if(cc) mvt('Clubs et activités',-cc*m);
  if(S.retenues) mvt('Heures de retenue du samedi',-40000*m);
  financesPlus(m);
  if(S.repetitions){const nc=S.eleves.filter(e=>isExam(e.level)).length;mvt('Cours de répétition payés par les parents',Math.round(nc*.5*2000*m));rel('parents',-1);integ(-.15);}
  S.etat=clamp(S.etat-1.25*(S.clubs?.environnement?.75:1)*m*(S.dv?2:1)*(S.surcharge?1.3:1)+S.budget.entretien/100000*1.1*m,0,100);
  if(S.soutien) mvt('Cours de soutien des classes d’examen',-120000*m);
 }
}
function coutMensuel(){return sum(S.profs.filter(p=>p.statut!=='fonctionnaire').map(p=>p.sal))+S.surveillants*45000+40000+200*S.eleves.length+S.budget.peda+S.budget.entretien+S.budget.social+sum(S.profs.map(p=>p.prime||0))+(S.soutien?120000:0);}

function inspecter(bonus){
 const c=couverture().ratio;const q=avg(S.profs.map(p=>p.q))||3;
 const sc=c*55+q*8+bonus+gauss(0,8)+(S.rel.inspection-50)/5;
 if(sc>70){rel('inspection',10);rep(2);return'Rapport élogieux : l’Inspecteur souligne le sérieux de l’équipe pédagogique.';}
 if(sc>50){rel('inspection',2);return'Rapport correct, avec quelques recommandations sur les progressions.';}
 rel('inspection',-10);rep(-3);return'Rapport défavorable : plusieurs classes sans enseignant et des cahiers de textes incomplets.';
}
function tirerEvenement(pr=.45){
 if(S.phase>12||S.over) return;
 if(S.phase===12){if(!S.evUsed.includes('prix')&&S.resultats){S.evUsed.push('prix');pushModal({type:'event',id:'prix',c:{}});}return;}
 const forced=EVENTS.filter(ev=>(ev.id==='unite'||ev.id==='genie'||ev.id==='elections'||ev.id==='excursion'||ev.id==='noel'||ev.id==='fuite'||ev.id==='enveloppe')&&!S.evUsed.includes(ev.id)&&!evRecent(ev.id)&&ev.when());
 if(!forced.length&&R()>pr*evIntensite()) return;
 const pool=(forced.length?forced:EVENTS.filter(ev=>!S.evUsed.includes(ev.id)&&!evRecent(ev.id)&&ev.when()));
 if(!pool.length) return;
 const wt=e=>e.w*((e.id==='controle'||e.id==='inspection')&&S.reputation>70?2.5:1)*(e.id==='tornade'&&S.etat<40?3:1)*(e.id==='greve'?1+S.profs.filter(p=>p.trait==='syndicaliste').length*.5:1);
 let t=R()*sum(pool.map(wt)),ev=pool[0];
 for(const e of pool){t-=wt(e);if(t<=0){ev=e;break;}}
 S.evUsed.push(ev.id);
 pushModal({type:'event',id:ev.id,c:ev.ctx?ev.ctx():{}});
}

const TRAITS={charismatique:'Charismatique',rigoureux:'Rigoureux',gonfleur:'Gonfleur de notes',cumulant:'Cumulant',syndicaliste:'Syndicaliste',ambitieux:'Ambitieux'};
const TRAIT_DESC={charismatique:'Les élèves l’adorent : +0,2 et bon moral.',rigoureux:'Exigeant et bien préparé : +0,25.',gonfleur:'Gonfle les notes de séquence (+1,5) sans aucun effet à l’examen.',cumulant:'Donne ses heures dans le privé : −0,8.',syndicaliste:'Mobilise ses collègues : les grèves sont plus fréquentes.',ambitieux:'Vise un poste de direction.'};
function tirerTrait(statut){if(R()>=.55)return null;const t=pick(['charismatique','rigoureux','rigoureux','gonfleur','gonfleur','cumulant','syndicaliste','ambitieux']);return t==='cumulant'&&statut!=='fonctionnaire'?'gonfleur':t;}
function traitTxt(p){return p.trait&&p.connu?`<span title="${esc(TRAIT_DESC[p.trait])}">${TRAITS[p.trait]}</span>`:'<span class="muted">—</span>';}
function revelerGonfleurs(){for(const p of S.profs) if(p.trait==='gonfleur'&&!p.connu){p.connu=true;log(`Les épreuves harmonisées révèlent que ${p.nom} (${MATIERES[p.mat]}) gonfle ses notes.`,'bad');}}
function gonfle(pm,div,s){const p=pm[S.affect[div]?.[s]];return p&&p.trait==='gonfleur'&&!S.harmo?1.5:0;}
function bonusGestion(){return Math.min(.45,S.budget.peda/100000*.15)-(S.etat<50?(50-S.etat)/50:0)-(S.surcharge?.6:0);}
function integ(d){S.integrite=clamp(S.integrite+d*4,0,100);}
function disc(d){S.discipline=clamp(S.discipline+d,0,100);}
function rez(k,d){S.reseau[k]=clamp(S.reseau[k]+d,0,100);}
const integLabel=()=>S.integrite>=70?'Intègre':S.integrite>=45?'Pragmatique':S.integrite>=25?'Débrouillard·e':'Compromis·e';
function retirer(e){S.eleves=S.eleves.filter(x=>x!==e);const d=S.divisions.find(d=>d.nom===e.div);if(d)d.ids=d.ids.filter(i=>i!==e.id);}
function initiales(n){const w=n.split(' ');return(w[0][0]+w[w.length-1][0]).toUpperCase();}
function lastMoy(e){const c=coefsOf(gkey(e.level,e.serie));for(let i=5;i>=0;i--){const m=moyW(e.notes[i],c);if(m!=null)return m;}return null;}

function faireFigure(e,t){
 e.fig={t};
 if(t==='genie'){e.base=clamp(e.base+2.5,10,18);e.apt.MATH+=3;e.apt.PCT+=1.5;}
 if(t==='promise'){e.base=clamp(e.base+1.5,9,17);}
 if(t==='sportif'){e.apt.EPS+=5;e.base=clamp(e.base-1,4,13);}
 if(t==='orphelin'){e.assid=clamp(e.assid-.15,.35,1);}
 if(t==='leader'){e.base=clamp(e.base+.5,7,16);}
 if(t==='fils'){e.fig.qui=pick(['maire','prefet','depute']);}
}
function choisirFigures(n,pool){
 const cands=(pool||S.eleves).filter(e=>!e.fig);
 for(let i=0;i<n&&cands.length;i++){
  const e=cands.splice(Math.floor(R()*cands.length),1)[0];
  let t=pick(Object.keys(FIG));if(t==='promise'&&e.sexe!=='F')t='genie';
  faireFigure(e,t);log(`Élève à suivre : ${e.nom} (${e.level}), ${FIG[t].l.toLowerCase()}.`);
 }
}
function ancien(e){
 const m=e.examen?.mention;const top=['Excellent','Très Bien','Bien'].includes(m);
 const dev=e.fig?.t==='sportif'?pick(['footballeur professionnel','entraîneur national','handballeur international']):top?pick(['médecin','ingénieur·e en télécommunications','magistrat·e','chercheur·se','pilote de ligne']):pick(['enseignant·e','commerçant·e','fonctionnaire','entrepreneur·e','journaliste']);
 S.alumni.push({nom:e.nom,annee:S.annee+1,t:e.fig?.t||'suivi',devenir:dev,don:false});
 log(`★ ${e.nom} quitte l’établissement avec son Bac. Dans quelques années : ${dev}.`,'good');
}

function tirerFigure(){
 if(S.over||S.pending&&S.queue.length>1||!(S.semaine>=2&&S.semaine<=37)||R()>.1) return;
 const c=S.eleves.filter(e=>e.fig&&e.fig.an!==S.annee&&(!FIGEV[e.fig.t].when||FIGEV[e.fig.t].when(e)));
 if(!c.length) return;
 const e=pick(c);e.fig.an=S.annee;
 if(e.fig.t==='fils'){ouvrirDiscipline(e,e.fig.qui);return;}
 pushModal({type:'fig',id:e.id});
}

function ouvrirDiscipline(e,qui,forced){
 const pool=qui?CAS.filter(c=>['triche','bagarre','insolence'].includes(c.id)):CAS;
 const c=forced?CAS.find(x=>x.id===forced):pick(pool);const tw=R()<.45;const dg=c.tem.find(x=>x.dg)?.dg||0;
 pushModal({type:'discipline',e:e.id,nom:e.nom,div:e.div,cas:c.id,tw,g:clamp(c.g+(tw?dg:0),0,4),heard:[],qui:qui||null});
}
function tirerDiscipline(){
 if(S.over||!(S.semaine>=2&&S.semaine<=37)) return;
 if(R()>.07+(50-S.discipline)/400) return;
 const c=S.eleves.filter(e=>e.level!=='6e'&&!e.fig);if(!c.length)return;
 ouvrirDiscipline(pick(c),null);
}
const QUI={maire:'le maire',prefet:'le sous-préfet',depute:'le député'};
function sanctionner(s){
 const p=S.pending;const c=CAS.find(x=>x.id===p.cas);const e=S.eleves.find(x=>x.id===p.e);const diff=s-p.g;const out=[];
 if(diff===0){integ(.5);disc(4);rel('parents',1);out.push('La sanction est jugée juste. La discipline se renforce.');}
 else if(diff<0){integ(diff*.5);disc(diff*3);if(p.g>=3)rep(-1);out.push(diff<=-2?'Le laxisme est remarqué : les élèves comprennent que tout est permis.':'La sanction paraît un peu légère.');}
 else{rel('parents',-diff*3);disc(2);if(diff>=2)integ(-1);out.push(diff>=2?'La sanction paraît injuste et disproportionnée. Les parents s’indignent.':'La sanction est sévère. Certains parents protestent.');}
 if(p.qui){if(s>=3){rez(p.qui,-15);out.push(`${QUI[p.qui][0].toUpperCase()+QUI[p.qui].slice(1)} est furieux et vous le fera payer.`);}else if(diff<0){integ(-1);rez(p.qui,8);out.push(`${QUI[p.qui][0].toUpperCase()+QUI[p.qui].slice(1)} apprécie votre « compréhension ».`);}}
 const tw=c.tem.find(x=>x.dg);
 if(p.tw&&tw&&!p.heard.includes(c.tem.indexOf(tw))) out.push(`Ce que vous ne saviez pas : ${tw.q.toLowerCase()} aurait déclaré « ${tw.rt} »`);
 else if(!p.tw&&tw&&!p.heard.includes(c.tem.indexOf(tw))&&diff===0) out.push('Les faits étaient bien établis.');
 if(e){if(s===4){retirer(e);out.push(`${e.nom} est exclu·e définitivement.`);}else if(s===3)e.assid=clamp(e.assid-.03,.3,1);}
 log(`Conseil de discipline : ${p.nom}, ${c.t.toLowerCase()}. Décision : ${SANC[s].toLowerCase()}.`,diff===0?'good':'');
 S.pending={type:'msg',titre:'Décision du conseil de discipline',html:out.map(esc).join('<br>')};
}

 {k:'parents',nom:'Président du bureau de l’APEE',fav:'Faire voter une hausse des frais de 10 %',req:60,desc:'Vote le budget et donne le ton chez les parents.'},
 {k:'maire',nom:'Maire de la commune',fav:'Obtenir un forage (offert)',req:60,desc:'Terrain, eau, voirie. N’oublie jamais un service rendu.'},
 {k:'prefet',nom:'Sous-préfet',fav:'Faire sécuriser le campus et les examens',req:50,desc:'Ordre public et sécurité des examens.'},
 {k:'depute',nom:'Député de la circonscription',fav:'Faire financer une salle par le BIP',req:55,desc:'Budget d’investissement public. Attend un retour en période électorale.'}

const relOf=k=>k==='inspection'||k==='parents'?S.rel[k]:S.reseau[k];
function addRel(k,d){if(k==='inspection'||k==='parents')rel(k,d);else rez(k,d);}
const reqOf=P=>P.k==='inspection'&&S.type==='prive'?60:P.req;
const favLabel=P=>P.k==='inspection'&&S.type==='prive'?'Obtenir une subvention à l’enseignement privé':P.fav;
function faveur(k){
 const P=PERSOS.find(x=>x.k===k);if(!P||S.actions.fav[k]||relOf(k)<reqOf(P))return;
 if(k==='inspection'){
  if(S.type==='public'){if(S.actions.demande)return;A.demande();return;}
  S.actions.fav[k]=true;mvt('Subvention à l’enseignement privé',1500000);rel('inspection',-15);log('La Délégation accorde une subvention de 1 500 000 FCFA à l’établissement.','good');
 }
 if(k==='parents'){S.actions.fav[k]=true;S.frais=Math.round(S.frais*1.1/500)*500;rel('parents',-10);log(`Le bureau de l’APEE vote une hausse des frais à ${money(S.frais)}.`);}
 if(k==='maire'){if(S.bat.forage)return;S.actions.fav[k]=true;S.bat.forage=true;rez('maire',-25);S.dettes.maire=true;log('Le maire fait installer un forage et un château d’eau. Il saura vous le rappeler.','good');}
 if(k==='prefet'){S.actions.fav[k]=true;S.flags.securite=true;disc(8);rez('prefet',-20);log('Le sous-préfet envoie des gendarmes pour sécuriser le campus et les examens.','good');}
 if(k==='depute'){S.actions.fav[k]=true;S.bat.salles++;rez('depute',-30);integ(-1);log('Le député fait financer une salle de classe. Il compte sur vous pendant la campagne.','good');}
 save();render();
}
function visite(k){if(S.pa<1||!(S.semaine>=1&&S.semaine<=36))return;S.pa--;mvt('Visite de courtoisie (cadeaux et déplacement)',-50000);addRel(k,6);save();render();}

/* --- Budget voté --- */
function exigenceSociale(){const base=S.type==='public'?20000+(S.frais-15000)*2.5:15000+(S.frais-90000)/4;return Math.max(0,Math.round((base-(S.rel.parents-50)*600)/5000)*5000);}
function voteBudget(){const ex=exigenceSociale();return S.budget.social<ex?`Le bureau de l’APEE rejette le budget. Il exige au moins ${money(ex)} par mois pour la cantine et les bourses.`:null;}
function budField(k,label,hint){return`<label class="f" for="bud-${k}">${label}<input id="bud-${k}" type="number" step="10000" min="0" max="500000" value="${S.budget[k]}" data-in="bud" data-k="${k}"></label><span class="small muted">${hint}</span>`;}
function budgetBloc(){return`${budField('peda','Pédagogie : manuels, craie, consommables (FCFA par mois)','+0,15 point sur toutes les notes par tranche de 100 000, plafonné à +0,45.')}
 ${budField('entretien','Entretien des bâtiments (FCFA par mois)','Les bâtiments perdent environ 15 % par an. 100 000 par mois compensent l’usure normale.')}
 ${budField('social','Social : cantine et bourses (FCFA par mois)','Moins d’absences et d’abandons. Les cas sociaux coûtent moins cher.')}`;}

/* --- Fin de mandat --- */
function finMandat(retraite){
 const best=meilleurRang();const I=S.integrite;let t,d;
 if(I>=65&&best<=2){t='Le Proviseur légendaire';d='Votre nom est donné à la nouvelle bibliothèque. Le Ministre vous nomme Délégué·e régional·e : vous dirigerez désormais tous les établissements de la région.';}
 else if(I>=65){t='Le serviteur intègre';d='Vos résultats n’ont pas toujours suivi, mais personne n’a jamais pu vous reprocher un franc. Les familles se souviendront d’un chef d’établissement juste.';}
 else if(I<35&&best<=3){t='Le parrain de l’éducation';d='Les résultats sont brillants et les notables vous adorent. Mais une enquête du Contrôle supérieur de l’État s’intéresse désormais à vos comptes…';}
 else if(I<35){t='Le mandat des enveloppes';d='Votre mandat restera celui des petits arrangements. Votre successeur trouve des caisses vides et des dossiers embarrassants.';}
 else if(best<=3){t='Le bâtisseur pragmatique';d='Vous avez su composer avec les réalités du terrain. L’établissement est solide et respecté : on vous propose la direction d’un grand lycée bilingue de Douala.';}
 else{t='Un mandat en demi-teinte';d='L’établissement a tenu bon, sans plus. Vous partez avec le sentiment du devoir accompli… à moitié.';}
 if(retraite)d=`Après ${anneesCarriere()} ans de carrière, l’heure de la retraite a sonné. `+d;
 S.over=`Fin de carrière : ${t}`;log(`Fin de mandat : ${t}.`,'good');
 S.queue=[];S.pending={type:'fin',t,d,best};
}

 s+=`<line x1="420" y1="${y0+132}" x2="420" y2="${y0+64}" stroke="var(--ink)" stroke-width="2"/><rect x="421" y="${y0+64}" width="8" height="18" fill="#23744a"/><rect x="429" y="${y0+64}" width="8" height="18" fill="#c8302a"/><rect x="437" y="${y0+64}" width="8" height="18" fill="#e5b62a"/>`;

function semainesAnnee(an){
 if(_semCache[an])return _semCache[an];

 const out=[];
 while(out.length<36){const m=d.getMonth(),j=d.getDate();

 return _semCache[an]=out;
}

function genHistoire(e,etab,annee,nomEtab){
 annee=annee??S.annee;const ici=nomEtab??S.nom;
 e.parcours=[];const CU=cursus(e.level);const idx=CU.indexOf(e.level);const start=annee-idx-1;const EN=anglo(e.level);
 e.parcours.push({annee:start,classe:EN?'Class 6':'CM2',etab:EN?'Government Primary School':'École primaire publique',moy:null,dec:`${EN?'Common Entrance':'Concours d’entrée en 6e'} : ${f2(q4(clamp(e.base+gauss(0,1.5),6,19)))}/20`});
 const orig=etab||ici;const chg=etab?Math.max(0,idx-1-Math.floor(R()*2)):idx;
 for(let i=0;i<idx;i++){
  const lv=CU[i];const an=start+1+i;
  let moy=clamp(e.base-(idx-i)*.12+gauss(.3,1),4,18.5);if(moy<9.5)moy=9.5+R()*.6;
  const se=SERIES_OF[lv]?(lv==='2nde'&&e.serie==='D'?'C':e.serie):null;
  const ex=EXAM_OF[lv]?(()=>{const em=clamp(moy+gauss(0,1),10,19);return{nom:EXAM_OF[lv],moy:em,admis:true,mention:mention(em),fraude:false};})():null;
  e.parcours.push({annee:an,classe:gkey(lv,se),etab:i>=chg&&etab?orig:(etab?pick(RIVAUX):ici),moy,rang:null,abs:Math.max(0,Math.round(gauss((1-e.assid)*60,8))),dec:moy<10?'Admis·e (repêché·e)':'Admis·e en classe supérieure',ex});
 }
}

function nouveauMessage(){
 if(!S.divisions.length)return;
 const pool=MSGS.filter(x=>(!x.cond||x.cond())&&!(S.messages||[]).some(m=>!m.done&&m.k===x.k));if(!pool.length)return;
 const T=pick(pool);const m={id:S.nextId++,k:T.k,div:pick(S.divisions).nom,sem:S.semaine,done:null};
 if(T.init)T.init(m);
 (S.messages||(S.messages=[])).unshift(m);if(S.messages.length>12)S.messages.length=12;
}
const nonLus=()=>(S.messages||[]).filter(m=>!m.done).length;
function repondre(id,i){

 const T=MSGS.find(x=>x.k===m.k);const c=T.r[i];if(!c)return;

function surveiller(){
 return S.eleves.map(e=>{const R0=[];const cur=lastMoy(e),prev=prevMoy(e);
  if(cur!=null&&prev!=null&&prev-cur>=1.5)R0.push(`Moyenne en baisse : ${f2(prev)} → ${f2(cur)}`);
  if(cur!=null&&cur<8)R0.push('Moyenne sous 8');
  if(e.abs>=25)R0.push(`${e.abs} h d’absence`);
  if((e.humeur??55)<35)R0.push('Moral au plus bas');
  return{e,R0,sc:R0.length+(cur!=null&&prev!=null?(prev-cur)/3:0)};}).filter(x=>x.R0.length).sort((a,b)=>b.sc-a.sc).slice(0,12);
}

const SEUIL_RENVOI=35;
function trimCourant(){return S.phase<=3?0:S.phase<=6?1:2;}
function chanceAide(){return clamp(.45+S.rel.inspection/200+(S.tresor<0?.2:0)-(S.integrite<35?.2:0),.1,.95);}
function montantAide(){return Math.round((1500000+5000*S.eleves.length)*(S.tresor<0?1.5:1)/50000)*50000;}
function demanderAide(){
 const k=`${S.annee}-${trimCourant()}`;S.aideT??={};if(S.aideT[k]||(S.phase===0&&S.semaine===0)||S.over)return;S.aideT[k]=true;
 if(R()<chanceAide()){const a=montantAide();mvt('Aide exceptionnelle du gouvernement',a);log(`Le gouvernement accorde une aide exceptionnelle de ${money(a)}.`,'good');S.derniere=`Aide de l’État accordée : ${money(a)}.`;}
 else{rel('inspection',-2);log('Le MINESEC rejette votre demande d’aide : « dossier insuffisamment justifié ». Nouvelle demande possible au trimestre suivant.','bad');S.derniere='Demande d’aide refusée. Vous pourrez la renouveler au trimestre suivant.';}
 save();render();
}
function cardAide(){
 const used=S.aideT?.[`${S.annee}-${trimCourant()}`];const ch=chanceAide();const off=used||(S.phase===0&&S.semaine===0)||S.over;
 return`<div class="card stack t-green"><h3>Aide financière de l’État</h3>
 <p class="small">À chaque rentrée, l’État verse une dotation de <b>10 000 000 FCFA</b>.</p>
 <p class="small">En cours d’année, vous pouvez demander une <b>aide exceptionnelle</b> une fois par trimestre : environ <b>${money(montantAide())}</b>${S.tresor<0?', montant majoré car la trésorerie est négative':''}.</p>
 <div class="row between"><span class="small">Chances d’accord : <b>${ch>=.7?'bonnes':ch>=.5?'moyennes':'faibles'}</b> (${Math.round(ch*100)} %)</span>
 <button class="btn ${off?'':'primary'}" data-act="aide-etat" ${off?'disabled':''}>${used?'Demande faite ce trimestre':'Demander l’aide'}</button></div>
 <p class="small muted">Les chances dépendent de vos relations avec le MINESEC et de votre intégrité. La trésorerie ne peut pas vous coûter votre poste : seuls les résultats aux examens comptent (minimum ${SEUIL_RENVOI} % de réussite globale).</p></div>`;
}

function avisProf(e,p,s){
 let note=null;for(let i=5;i>=0;i--){const v=e.notes[i]?.[s];if(v!=null){note=v;break;}}
 const sc=((note??9)-8)*.5+((e.humeur??55)-50)/25+(e.abs<25?.5:-.6)+(p.trait==='charismatique'?.8:p.trait==='rigoureux'?-.8:0)+gauss(0,.8);
 const pour=sc<0;
 const txt=pour?pick([`En ${MATIERES[s].toLowerCase()}, ${f2(note)} de moyenne : aucun progrès en deux ans.`,'Il ou elle perturbe le cours et ne rend aucun devoir.','Un troisième passage dans la même classe ne servira à rien.','Les places manquent : laissons la sienne à un élève motivé.']):pick([`En ${MATIERES[s].toLowerCase()}, des progrès nets ce trimestre (${f2(note)}).`,'Une situation familiale difficile explique beaucoup de choses.','Assidu·e et poli·e : laissons-lui une dernière chance.','L’exclure, c’est le ou la condamner à la rue.']);
 return{pnom:p.nom,mat:MATIERES[s],v:pour?1:-1,txt};
}
function ouvrirTriples(list,exam){
 const pm=profMap();
 const cas=list.map(e=>{const seen=new Set(),avis=[];
  for(const s in coefsOf(gkey(e.level,e.serie))){const id=S.affect[e.div]?.[s];if(id==null||seen.has(id))continue;seen.add(id);const p=pm[id];if(p)avis.push(avisProf(e,p,s));}
  if(!avis.length)avis.push({pnom:'Le censeur',mat:'Administration',v:1,txt:'Le règlement prévoit l’exclusion après un second échec.'});
  return{id:e.id,nom:e.nom,div:e.div,moy:exam?e.examen?.moy:e.annuelle,avis:avis.slice(0,7),plaide:false,rappel:false,res:null,via:''};});
 return{type:'triples',exam:!!exam,cas,open:null};
}

const RENOS=[

function coutPointEtat(){return Math.round((30000+S.bat.salles*1500)*(S.type==='public'?.5:1)/1000)*1000;}
function renoPts(r){return Math.max(0,r.pts==null?Math.ceil(100-S.etat):Math.min(r.pts,Math.ceil(100-S.etat)));}
function renoCout(r){return Math.round(renoPts(r)*coutPointEtat()*r.rem/1000)*1000;}

 const r=RENOS.find(x=>x.k===k);if(!r||S.over)return;const p=renoPts(r);if(p<=0)return;const c=renoCout(r);if(S.tresor<c)return;

function moyMat(e,s){const v=e.notes.map(n=>n[s]).filter(x=>x!=null);return v.length?avg(v):null;}
const orOpts=g=>g==='3e'?['A4','C','TI'].filter(serieOuverte):['C','D','A4'].filter(serieOuverte);

 const m=s=>moyMat(e,s)??0;const o=orOpts(g);
 if(g==='3e'){const sc={C:(m('MATH')*2+m('PCT'))/3,A4:(m('FR')+m('ANG')+m('HG'))/3,TI:(m('MATH')+m('INFO'))/2};
  return o.filter(x=>x!=='C'||sc.C>=11).sort((a,b)=>sc[b]-sc[a])[0]||o[0];}
 if(m('MATH')<9&&o.includes('A4'))return'A4';
 return m('MATH')>=11.5&&m('MATH')>=m('SVT')?'C':(o.includes('D')?'D':'C');
}
function orVoeu(e,g,avis){const o=orOpts(g);const v=R()<.45&&o.includes('C')?'C':R()<.75?avis:pick(o);return o.includes(v)?v:avis;}

 const G=[];if(g1.length&&orOpts('3e').length>1)G.push(mk('3e',g1));if(g2.length&&orOpts('2ndeC').length>1)G.push(mk('2ndeC',g2));

function orProfs(e,g,r){

 const out=[];
 for(const s of subs){const p=pm[S.affect[e.div]?.[s]];const m=moyMat(e,s);if(m==null)continue;let v,t;
  if(s==='MATH'){v=m>=12?'C':g==='3e'?(m>=10.5?'C':'A4'):(m<9?'A4':'D');t=m>=12?`${f2(m)} en maths : il ou elle a sa place en série C.`:`${f2(m)} en maths : la série C serait trop exigeante.`;}
  else if(s==='PCT'){v=m>=12?'C':g==='3e'?(m>=10?'C':'A4'):'D';t=`${f2(m)} en physique-chimie.`;}
  else if(s==='SVT'){v=g==='3e'?(m>=12&&(moyMat(e,'MATH')??0)>=10?'C':'A4'):(m>=11?'D':'A4');t=`${f2(m)} en SVT${g!=='3e'&&m>=11?' : un profil idéal pour la série D':''}.`;}
  else if(s==='INFO'){v=m>=13&&(moyMat(e,'MATH')??0)>=11?'TI':r.avis;t=`${f2(m)} en informatique${v==='TI'?' : la série TI lui irait bien':''}.`;}

/* --- Fraude : environ une session sur vingt --- */
function tirageFraude(){
 const set=new Set();const cands=S.eleves.filter(e=>EXAM_OF[e.level]);if(!cands.length)return set;
 const p=.045*(S.prep.sensib?.5:1)*(1.6-S.discipline/100)*(S.flags.securite?.5:1)*(S.flags.fuite?4:1);
 if(R()<p){const k=1+Math.floor(R()*2);cands.slice().sort(()=>R()-.5).slice(0,k).forEach(e=>set.add(e.id));}
 return set;
}

function alleger(){
 try{S.journal=S.journal.slice(0,80);S.ledger=S.ledger.slice(0,120);
  for(const e of S.eleves){if(e.parcours&&e.parcours.length>8)e.parcours=e.parcours.slice(-8);if(e.dial)e.dial=e.dial.slice(0,3);}
  (S.concours||[]).forEach((c,i)=>{if(i>0)c.pools.forEach(p=>p.liste=p.liste.filter(x=>x.admis));});
  S.majors=(S.majors||[]).slice(-90);S.messages=(S.messages||[]).slice(0,8);
 }catch(e){}
}
/* --- Petit générateur aléatoire stable (pour les scènes) --- */
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const PEAUX=['#4a2c1a','#5a3825','#6b4226','#7a4b2a','#8d5524','#a0673f'];

];

function perso(x,y,s,o){
 const sk=o.peau,ch=o.chemise,b=o.bas,a=o.acc,hc=o.cheveux||'#151515';
 let g=`<g transform="translate(${x},${y}) scale(${s})"><ellipse cx="20" cy="112" rx="16" ry="4" fill="rgba(0,0,0,.18)"/>`;
 if(o.fille)g+=`<rect x="12" y="78" width="6" height="30" fill="${sk}"/><rect x="22" y="78" width="6" height="30" fill="${sk}"/><path d="M8 62 L32 62 L37 86 L3 86 Z" fill="${b}"/>`;
 else g+=`<rect x="11" y="62" width="8" height="46" fill="${b}"/><rect x="21" y="62" width="8" height="46" fill="${b}"/>`;
 g+=`<rect x="8" y="106" width="12" height="5" rx="2" fill="#1f2937"/><rect x="20" y="106" width="12" height="5" rx="2" fill="#1f2937"/>`;
 g+=`<rect x="2" y="34" width="7" height="26" rx="3" fill="${ch}"/><rect x="31" y="34" width="7" height="26" rx="3" fill="${ch}"/><circle cx="5.5" cy="62" r="3.5" fill="${sk}"/><circle cx="34.5" cy="62" r="3.5" fill="${sk}"/>`;
 g+=`<path d="M7 32 Q20 27 33 32 L33 65 L7 65 Z" fill="${ch}" stroke="rgba(0,0,0,.12)" stroke-width=".6"/><path d="M15 30 L20 37 L25 30" fill="none" stroke="rgba(0,0,0,.28)" stroke-width="1.2"/>`;
 if(o.type==='cravate')g+=`<path d="M18.5 33 L21.5 33 L22.6 50 L20 54 L17.4 50 Z" fill="${a}"/>`;
 else if(o.type==='foulard')g+=`<path d="M12.5 30 L27.5 30 L20 41 Z" fill="${a}"/>`;
 if(o.badge!==false)g+=`<rect x="25.5" y="38" width="5" height="6" rx="1" fill="${a}" opacity=".9"/>`;
 g+=`<rect x="17" y="24" width="6" height="7" fill="${sk}"/><circle cx="20" cy="16" r="11" fill="${sk}"/>`;
 g+=o.fille?`<path d="M9 15 Q9 3 20 3 Q31 3 31 15 Q28 9 20 9 Q12 9 9 15 Z" fill="${hc}"/><circle cx="20" cy="2.5" r="4" fill="${hc}"/>`:`<path d="M9.5 13 Q10 4 20 4 Q30 4 30.5 13 Q26 8 20 8 Q14 8 9.5 13 Z" fill="${hc}"/>`;
 if(o.lunettes)g+=`<circle cx="16" cy="16" r="3.3" fill="none" stroke="#111" stroke-width="1"/><circle cx="24" cy="16" r="3.3" fill="none" stroke="#111" stroke-width="1"/><line x1="19.3" y1="16" x2="20.7" y2="16" stroke="#111"/>`;
 g+=`<circle cx="16" cy="16" r="1.3" fill="#111"/><circle cx="24" cy="16" r="1.3" fill="#111"/><path d="M16.5 21 Q20 ${o.triste?19:24} 23.5 21" fill="none" stroke="#111" stroke-width="1.1" stroke-linecap="round"/>`;
 return g+'</g>';
}

function foule(n,seed,x0,x1,y0,y1,s0,s1,extra={}){const r=rng(seed);const P=[];for(let i=0;i<n;i++)P.push({x:x0+r()*(x1-x0),y:y0+r()*(y1-y0),s:s0+r()*(s1-s0)});P.sort((a,b)=>a.y-b.y);const t=tenueCourante();return P.map(p=>eleveFig(p.x,p.y,p.s,r,{...t,...extra})).join('');}

function genCenseur(){const f=R()<.4;return{nom:(f?'Mme ':'M. ')+pick(NOMS)+' '+(f?pick(PRENOMS_F):pick(PRENOMS_M)),f,trait:pick(['rigoureux','bienveillant','malicieux']),peau:PEAUX[Math.floor(R()*PEAUX.length)]};}
const PROVERBES=['Le bâton qui reste dans l’eau ne devient pas crocodile.','Un seul doigt ne peut pas laver le visage.','C’est au bout de l’ancienne corde qu’on tisse la nouvelle.','La patience est amère, mais son fruit est doux.','Quand la tête ne va pas, les pieds souffrent.','Petit à petit, l’oiseau fait son nid.','L’arbre ne tombe pas au premier coup de hache.','Celui qui pose des questions ne se perd pas.'];
const TRAIT_C={rigoureux:'Rigoureux',bienveillant:'Bienveillant',malicieux:'Plein d’humour'};
function vari(arr,salt){return arr[Math.abs((S.annee*97+(S.semaine||0)*13+S.phase*7+salt*31))%arr.length];}
function signature(){const t=S.censeur.trait;return t==='rigoureux'?pick(['Le règlement, c’est le règlement.','La discipline d’abord, le reste suivra.','Je reste à cheval sur la rigueur.']):t==='bienveillant'?pick(['Nos élèves ont du cœur, il faut seulement les accompagner.','Un mot d’encouragement vaut parfois une heure de cours.','Je crois en eux, Monsieur le Proviseur.']):'Comme on dit chez nous : « '+pick(PROVERBES)+' »';}
function avatarCenseur(sz=64){const c=S.censeur;return`<svg viewBox="0 0 80 80" width="${sz}" height="${sz}" role="img" aria-label="${esc(c.nom)}"><circle cx="40" cy="40" r="40" fill="var(--t-blue)"/>${perso(20,8,1,{peau:c.peau,fille:c.f,chemise:'#1e293b',bas:'#1e293b',acc:'#b91c1c',type:c.f?'foulard':'cravate',badge:false,lunettes:c.trait==='rigoureux'})}</svg>`;}
function salutCenseur(long){
 const c=S.censeur;const t=S.hist.at(-1)?.taux;const ph=PH().id;
 const L=[];
 if(S.phase===0&&S.semaine===0)L.push('Bonne rentrée, Monsieur le Proviseur. Les candidats se pressent déjà devant le portail.','Tout est prêt pour la rentrée. Il ne manque que vos décisions.');
 else if(ph==='examens'||ph==='blanc')L.push('Les examens approchent. Les candidats sont nerveux, et les enseignants aussi.','C’est la dernière ligne droite avant les examens officiels.');
 else if(S.semaine>=1&&S.semaine<=36)L.push(`Semaine ${S.semaine} : la machine tourne, Monsieur le Proviseur.`,`Bonjour, Monsieur le Proviseur. ${S.eleves.length} élèves comptent sur nous cette semaine.`,'Le rassemblement de ce matin s’est bien passé.');
 if(t!=null&&t>=70)L.push(`Avec ${Math.round(t)} % de réussite l’an dernier, toute la ville parle de nous.`);
 if(t!=null&&t<40)L.push(`${Math.round(t)} % de réussite l’an dernier… Il va falloir se retrousser les manches.`);
 if(S.discipline>75)L.push('La cour n’a jamais été aussi calme.');
 if(moral()<45)L.push('L’ambiance en salle des professeurs est lourde ces temps-ci.');
 const base=L.length?vari(L,5):'Bonjour, Monsieur le Proviseur.';
 return long?base+' '+signature():base;
}
function conseils(){
 const T=[];const cov=couverture();const nl=nonLus();const W=surveiller().length;

 if(S.tresor<0)T.push(vari(['Notre caisse est dans le rouge. L’aide exceptionnelle de l’État (onglet Finances) pourrait nous sauver.','Les fournisseurs commencent à appeler… Une demande d’aide au gouvernement s’impose.','La trésorerie est négative. Demandons l’aide de l’État avant que les enseignants ne s’impatientent.'],2));
 if(cov.ratio<1){const n=cov.need-cov.cov;T.push(vari([`${n} cours n’ont toujours pas d’enseignant. Les élèves s’en plaignent déjà.`,`Il nous manque des professeurs : ${n} cours restent vides. Un tour dans l’onglet Personnel s’impose.`,`Sans enseignants, pas de résultats : ${n} cours ne sont pas assurés.`],3));}
 if(S.etat<50)T.push(vari(['Les toitures fuient et les tables-bancs sont cassés. Des travaux de rénovation (Infrastructure) seraient bienvenus.',`Les bâtiments sont à ${Math.round(S.etat)}/100. Il faudrait rénover et augmenter le budget d’entretien.`,'Un parent m’a demandé si nous comptions repeindre un jour… Les bâtiments se dégradent.'],4));
 if(S.discipline<40)T.push(vari(['La cour devient un marché. Un discours « Discipline » lundi ne serait pas de trop.','Les retards se multiplient. Une ronde de discipline cette semaine ?','Les surveillants sont débordés : la discipline se relâche.'],5));
 if(nl)T.push(vari([`${nl} message${nl>1?'s':''} des délégués attend${nl>1?'ent':''} votre réponse dans Vie scolaire.`,`Les délégués m’ont relancé : ${nl} message${nl>1?'s':''} sans réponse.`],6));
 if(W>=5)T.push(vari([`${W} élèves m’inquiètent : moyennes en chute, absences, moral en berne. La liste est dans Vie scolaire.`,`Quelques entretiens individuels feraient du bien : ${W} élèves décrochent.`],7));

 if(seqW){const sv=S.hebdo.surv||'normale';
  if(sv==='legere')A.notes+=.4*(A.n+1);
  else if(sv==='renforcee'){mvt('Surveillance renforcée des épreuves',-40000);A.notes-=.05*(A.n+1);if(R()<.35)flagrant();}
  else if(R()<.12)flagrant();}
 if(S.bareme==='indulgent'){humeurAll(.3);rel('parents',.1);}
 if(S.bareme==='severe'){humeurAll(-.3);disc(.3);}
 if(S.parrainage){for(const e of S.eleves)if(e.level==='6e')e.humeur=clamp((e.humeur??55)+.5,0,100);A.exam+=.03;}
 if(S.retenues){disc(.8);humeurAll(-.3);}
 if(S.gouv){if(S.gouv.prog==='fun'){humeurAll(.3);disc(-.1);}if(S.gouv.prog==='ordre')disc(.4);if(S.gouv.prog==='revisions')A.exam+=.05;}
 const mt=meteo(w);if(mt.k==='pluie')A.assid-=.01;if(mt.k==='canicule')A.notes-=.05;
 if(S.eleveSemaine&&S.eds?.w===w){const e=S.eleves.find(x=>x.id===S.eds.id);if(e)e.humeur=clamp((e.humeur??55)+12,0,100);}

}

function meteo(w){
 if(w<1||w>36)return{k:'soleil',l:'Grand soleil'};
 const r=rng(S.annee*1000+w*7+S.reg);const m=moisSem(w);const nord=['Nord','Extrême-Nord','Adamaoua'].includes(REG().r);
 const pluv=nord?['juin','juil','aout','sept'].includes(m):['mars','avr','mai','sept','oct','nov'].includes(m);const x=r();
 if(nord&&['dec','janv','fevr'].includes(m)&&x<.6)return{k:'harmattan',l:'Harmattan poussiéreux'};

 return`<div class="row" style="gap:8px;align-items:center"><span class="small"><b>Appréciation du chef d’établissement :</b></span>${cur?`<span class="chip ${cur==='fel'||cur==='enc'?'ok':'bad'}">${APPR[cur]}</span>`:`<select aria-label="Appréciation du chef d’établissement" data-in="appr" data-id="${e.id}" data-t="${t}"><option value="">— choisir —</option>${Object.entries(APPR).map(([k,l])=>`<option value="${k}">${l}</option>`).join('')}</select>`}</div>`;
}
function apprecier(e,t,k){
 e.appr=e.appr||{};if(e.appr[t]||!APPR[k])return;e.appr[t]=k;const m=e.trim[t]??lastMoy(e)??10;
 if(k==='fel')e.humeur=clamp((e.humeur??55)+(m>=14?12:4),0,100);
 if(k==='enc')e.humeur=clamp((e.humeur??55)+7,0,100);
 if(k==='pmf'){e.assid=clamp(e.assid+.03,.3,1);e.humeur=clamp((e.humeur??55)-2,0,100);}
 if(k==='avt'){e.assid=clamp(e.assid+.05,.3,1);e.humeur=clamp((e.humeur??55)-8,0,100);}
 if(k==='avc'){disc(.5);e.humeur=clamp((e.humeur??55)-6,0,100);}
 e.dial=[{q:'Bulletin',r:`(Appréciation) ${APPR[k]}.`},...(e.dial||[])].slice(0,6);
 save();render();
}
function sparkNotes(e,s){
 const v=e.notes.map(n=>n[s]);const pts=v.map((x,i)=>x==null?null:[4+i*11,18-x/20*16]).filter(Boolean);if(pts.length<2)return'';
 const last=v.filter(x=>x!=null).at(-1);
 return`<svg viewBox="0 0 64 20" width="64" height="20" aria-hidden="true"><line x1="0" x2="64" y1="10" y2="10" stroke="var(--line)" stroke-dasharray="2 2"/><polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="${last<10?'var(--red)':'var(--blue)'}" stroke-width="1.8"/><circle cx="${pts.at(-1)[0]}" cy="${pts.at(-1)[1]}" r="2.2" fill="${last<10?'var(--red)':'var(--blue)'}"/></svg>`;
}

/* --- Photo de classe --- */
function renderPhoto(m){
 const d=S.divisions.find(x=>x.nom===m.div);if(!d)return'';
 const em=new Map(S.eleves.map(e=>[e.id,e]));const L=d.ids.map(i=>em.get(i)).filter(Boolean).slice(0,70);
 const perRow=Math.min(14,Math.max(6,Math.ceil(L.length/Math.ceil(L.length/14))));const rows=[];for(let i=0;i<L.length;i+=perRow)rows.push(L.slice(i,i+perRow));
 const s=.8,cw=40*s+6,W=Math.max(500,perRow*cw+100),H=70+rows.length*58+60;const t=tenueCourante();
 let g=`<rect width="${W}" height="${H}" fill="#e0e7ff"/><rect y="${H-40}" width="${W}" height="40" fill="#d9a066"/><rect x="20" y="12" width="${W-40}" height="34" rx="6" fill="#1e3a8a"/><text x="${W/2}" y="35" text-anchor="middle" font-size="16" fill="#fff" font-family="Georgia,serif">${esc(S.nom)} · ${esc(d.nom)} · ${S.annee}–${S.annee+1}</text>`;
 const pp=S.profs.find(p=>p.id===S.affect[d.nom]?.FR)||S.profs[0];
 rows.forEach((row,ri)=>{const y=60+ri*58;const x0=(W-row.length*cw)/2+(ri%2?cw/2:0)-cw/4;
  if(ri<rows.length-1)g+=`<rect x="${x0-6}" y="${y+84}" width="${row.length*cw+12}" height="8" fill="#92400e"/>`;
  row.forEach((e,i)=>{const r=rng(e.id*7919);g+=perso(x0+i*cw,y,s,{peau:PEAUX[Math.floor(r()*PEAUX.length)],fille:e.sexe==='F',...t});});});
 if(pp)g+=adulte(W-62,H-140,1,'#1f2937','#1f2937',pp.id);
 return form('Photo de classe',`${esc(d.nom)} · ${L.length} élèves`,`<div class="illus scroll"><svg viewBox="0 0 ${W} ${H}" style="min-width:${Math.min(W,520)}px" role="img" aria-label="Photo de classe">${g}</svg></div><p class="small muted">Professeur principal : ${pp?esc(pp.nom):'—'}. Tenue : ${S.tenueAn?`modèle adopté en ${S.tenueAn}`:'tenue d’origine'}.</p>`,'<button class="btn primary" data-act="close-ui">Fermer</button>');
}

/* --- Palmarès insolite --- */
function cardPalmares(){
 const L=S.eleves.filter(e=>lastMoy(e)!=null);if(!L.length)return'';
 const prog=L.filter(e=>prevMoy(e)!=null).sort((a,b)=>(lastMoy(b)-prevMoy(b))-(lastMoy(a)-prevMoy(a)))[0];
 const absent=S.eleves.slice().sort((a,b)=>b.abs-a.abs)[0];const fidele=L.filter(e=>e.abs===0);
 const major=L.slice().sort((a,b)=>lastMoy(b)-lastMoy(a))[0];const jeune=S.eleves.slice().sort((a,b)=>a.age-b.age)[0];
 const em=new Map(S.eleves.map(e=>[e.id,e]));const heur=S.divisions.map(d=>({n:d.nom,h:avg(d.ids.map(i=>em.get(i)?.humeur??55))??55})).sort((a,b)=>b.h-a.h)[0];
 const it=(t,v,s)=>`<div class="stat"><span class="eyebrow">${t}</span><b style="font-size:.95rem">${v}</b><span class="small">${s}</span></div>`;
 return`<div class="card t-rose"><h3>Palmarès insolite</h3><div class="statgrid">
 ${it('Major de l’établissement',esc(major.nom),`${major.div} · ${f2(lastMoy(major))}`)}
 ${prog?it('Plus belle remontée',esc(prog.nom),`${f2(prevMoy(prog))} → ${f2(lastMoy(prog))}`):''}
 ${it('Champion·ne des absences',esc(absent.nom),`${absent.abs} heures manquées`)}
 ${it('Jamais absent·e',`${fidele.length} élève${fidele.length>1?'s':''}`,'zéro heure d’absence')}
 ${it('Plus jeune élève',esc(jeune.nom),`${jeune.age} ans, en ${jeune.div}`)}
 ${heur?it('Classe la plus joyeuse',heur.n,`moral ${Math.round(heur.h)}/100`):''}
 ${S.classeMois?it('Classe du mois',S.classeMois,'fanion d’honneur'):''}</div></div>`;
}

 try{const T=THREE;const pr=renderer.getPixelRatio();let rt;
  if(renderer.capabilities.isWebGL2&&T.WebGLMultisampleRenderTarget){rt=new T.WebGLMultisampleRenderTarget(w*pr,h*pr,{format:T.RGBAFormat});rt.samples=4;}
  const comp=new T.EffectComposer(renderer,rt);comp.setPixelRatio(pr);comp.setSize(w,h);
  comp.addPass(new T.RenderPass(scene,cam));
  let bok=null;if(o.bokeh&&T.BokehPass){bok=new T.BokehPass(scene,cam,{focus:20,aperture:.00008,maxblur:.0055,width:w,height:h});comp.addPass(bok);}
  const bloom=new T.UnrealBloomPass(new T.Vector2(w,h),.45,.55,.86);comp.addPass(bloom);
  const grade=new T.ShaderPass({uniforms:{tDiffuse:{value:null},sat:{value:1.2}},
   vertexShader:'varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',
   fragmentShader:'uniform sampler2D tDiffuse;uniform float sat;varying vec2 vUv;void main(){vec4 c=texture2D(tDiffuse,vUv);float l=dot(c.rgb,vec3(0.2126,0.7152,0.0722));c.rgb=mix(vec3(l),c.rgb,sat);c.rgb*=vec3(1.035,1.0,0.955);c.rgb=pow(c.rgb,vec3(1.12));float d=distance(vUv,vec2(0.5));c.rgb*=1.0-0.55*smoothstep(0.38,0.85,d);gl_FragColor=linearToOutputTexel(c);}'});
  comp.addPass(grade);
  return{render(){if(bok&&o.cible){const v=o.cible();if(v)bok.uniforms.focus.value=cam.position.distanceTo(v);}comp.render();},resize(w2,h2){comp.setSize(w2,h2);}};
 }catch(e){console.warn(e);return null;}
}

/* ================= Fusion des objets immobiles (accélère l'affichage) ================= */
function fxFusion(scene,T){
 try{
  scene.updateMatrixWorld(true);const groupes=new Map();const pris=[];
  scene.traverse(m=>{
   if(!m.isMesh||m.userData.dyn)return;const mat=m.material;
   if(!mat||Array.isArray(mat)||mat.transparent||!(mat.isMeshLambertMaterial||mat.isMeshStandardMaterial))return;
   let ok=m.parent===scene;
   if(!ok){let p=m.parent;while(p&&p!==scene){if(p.userData&&p.userData.statique){ok=true;break;}p=p.parent;}}
   if(!ok)return;
   const k=mat.uuid;if(!groupes.has(k))groupes.set(k,{mat,L:[]});groupes.get(k).L.push(m);pris.push(m);
  });
  let avant=pris.length,apres=0;
  for(const {mat,L} of groupes.values()){
   if(L.length<2)continue;
   const parts=L.map(m=>{let g=m.geometry.index?m.geometry.toNonIndexed():m.geometry.clone();g.applyMatrix4(m.matrixWorld);return g;});
   let n=0;for(const g of parts)n+=g.attributes.position.count;
   const P=new Float32Array(n*3),N=new Float32Array(n*3),U=new Float32Array(n*2);let o=0;
   for(const g of parts){const c=g.attributes.position.count;P.set(g.attributes.position.array,o*3);if(g.attributes.normal)N.set(g.attributes.normal.array,o*3);if(g.attributes.uv)U.set(g.attributes.uv.array,o*2);o+=c;g.dispose();}
   const geo=new T.BufferGeometry();geo.setAttribute('position',new T.BufferAttribute(P,3));geo.setAttribute('normal',new T.BufferAttribute(N,3));geo.setAttribute('uv',new T.BufferAttribute(U,2));geo.computeBoundingSphere();
   const fus=new T.Mesh(geo,mat);fus.castShadow=fus.receiveShadow=true;fus.userData.fus=true;scene.add(fus);apres++;
   for(const m of L)m.parent&&m.parent.remove(m);
  }
  return{avant,apres};
 }catch(e){console.warn('fusion',e);return null;}
}

function copieData(e,s,q){
 const ex=q==='ex';let note=ex?e.examen?.notes?.[s]:q!=null?e.notes?.[q]?.[s]:null;
 const r=rng(e.id*131+s.charCodeAt(0)*977+s.length*31+(ex?99:q==null?55:q)*7919);
 if(note==null)note=q4(clamp((e.base||10)+((e.apt&&e.apt[s])||0)+(r()-.5)*4,1,19.5));
 const EN=anglo(e.level);const bank=(EN&&COPIE_EN[s])||COPIE_BANQUE[s]||COPIE_BANQUE.FR;
 const items=bank.map(x=>[r(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]).slice(0,Math.min(4,bank.length));
 const MX={1:[20],2:[8,12],3:[6,6,8],4:[4,5,5,6]}[items.length];
 const w=items.map((_,i)=>MX[i]*clamp(note/20+(r()-.5)*.5,.03,1));
 let pts=items.map(()=>0),reste=note,libres=items.map((_,i)=>i);
 for(let it=0;it<5&&reste>.01&&libres.length;it++){const sw=sum(libres.map(i=>w[i]))||1;const nl=[];for(const i of libres){const v=Math.min(MX[i],pts[i]+reste*w[i]/sw);pts[i]=v;if(v<MX[i]-.01)nl.push(i);}reste=note-sum(pts);libres=nl;}
 pts=pts.map(v=>Math.round(v*4)/4);
 const diff=Math.round((note-sum(pts))*4)/4;if(diff){const i=pts.findIndex((v,i)=>v+diff>=0&&v+diff<=MX[i]);if(i>=0)pts[i]+=diff;}
 const C=EN?COM_EN:COM_FR;
 const exs=items.map((x,i)=>{const t=pts[i]/MX[i];const lv=t>=.85?0:t>=.6?1:t>=.35?2:3;return{q:x.q,rep:t>=.55?x.ok:t>=.35?x.ok.slice(0,Math.max(14,Math.round(x.ok.length*.6)))+'…':x.ko,ok:t>=.55,faux:t<.35,max:MX[i],pts:pts[i],com:C[lv][Math.floor(r()*C[lv].length)]};});
 const prof=ex?null:profMap()[S.affect[e.div]?.[s]]||null;
 const appr=EN?(note>=16?'Excellent work. Keep it up!':note>=14?'Very good work.':note>=12?'Good. Keep working.':note>=10?'Fair. You can do better.':note>=8?'Weak. More effort needed.':'Very weak. See me.')
  :(note>=16?'Excellent travail, félicitations !':note>=14?'Très bon travail.':note>=12?'Bon travail, continuez.':note>=10?'Passable. Peut mieux faire.':note>=8?'Insuffisant. Il faut travailler davantage.':'Très faible. Venez me voir avec vos parents.');
 return{e,s,q,note,ex,exs,prof,appr,EN,gce:ex&&e.examen?.gce?e.examen.gce[s]:null,mat:nomMat(s,e.level)};
}

 for(const h of H.slice(-8))sais[h.annee]={t:r1(h.taux),bepc:r1(h.BEPC),prob:r1(h.Probatoire),bac:r1(h.Bac),go:r1(h['GCE O Level']),ga:r1(h['GCE A Level']),rep:Math.round(h.rep||0),eff:h.eff||0,rd:h.rangDep??null,rn:h.rangReg??null};
 const best=H.map(h=>h.rangReg).filter(x=>x!=null);
 return{v:1,uid:S.uid,nom:String(S.nom).slice(0,60),prov:String(S.proviseur||'').slice(0,40),type:S.type,reg:REG().r,ville:REG().v,annee:S.annee,ans:H.length,
  rep:Math.round(S.reputation),eff:S.eleves.length,taux:r1(last.taux),rd:last.rangDep??null,rn:last.rangReg??null,best:best.length?Math.min(...best):null,
  tn:{c:S.tenue?.chemise,b:S.tenue?.bas,a:S.tenue?.acc},dev:String(S.devise||'').slice(0,60),masc:S.mascotte||'',anglo:!!S.bat.anglo,sais,maj:Date.now()};
}
/* Tout ce qui vient d'un autre joueur est vérifié champ par champ. */
function carteValide(o){
 if(!o||typeof o!=='object')return null;o=nettoyer(JSON.parse(JSON.stringify(o)));
 const n=x=>{if(x==null||x==='')return null;x=+x;return isFinite(x)?x:null;},p=x=>{x=n(x);return x==null?null:clamp(x,0,100);};
 const c={uid:propre(o.uid).replace(/[^A-Za-z0-9_.:@+~-]/g,'').slice(0,64),nom:propre(o.nom).slice(0,60)||'Lycée sans nom',prov:propre(o.prov).slice(0,40),type:o.type==='prive'?'prive':'public',
  reg:propre(o.reg).slice(0,30),ville:propre(o.ville).slice(0,30),annee:n(o.annee),ans:clamp(n(o.ans)||0,0,60),rep:clamp(n(o.rep)||0,0,100),eff:clamp(n(o.eff)||0,0,20000),
  taux:p(o.taux),rd:n(o.rd),rn:n(o.rn),best:n(o.best),tn:{c:couleurOk(o.tn?.c),b:couleurOk(o.tn?.b),a:couleurOk(o.tn?.a)},dev:propre(o.dev).slice(0,60),masc:MASCOTTES[o.masc]?o.masc:'',anglo:!!o.anglo,sais:{},maj:n(o.maj)||0};
 for(const [k,v] of Object.entries(o.sais&&typeof o.sais==='object'?o.sais:{}).slice(-12)){const y=n(k);if(y==null||!v||typeof v!=='object')continue;
  c.sais[y]={t:p(v.t),bepc:p(v.bepc),prob:p(v.prob),bac:p(v.bac),go:p(v.go),ga:p(v.ga),rep:clamp(n(v.rep)||0,0,100),eff:clamp(n(v.eff)||0,0,20000),rd:n(v.rd),rn:n(v.rn)};}
 return c.uid?c:null;
}
/* --- Codes à échanger --- */
function hash4(t){let h=2166136261;for(let i=0;i<t.length;i++){h^=t.charCodeAt(i);h=Math.imul(h,16777619);}return(h>>>0).toString(16).slice(-4).padStart(4,'0');}
function codeLycee(){
 const j=JSON.stringify(carteLycee());const b=btoa(unescape(encodeURIComponent(j))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
 return`PROVISEUR-${b}-${hash4(b)}`;
}
function lireCode(t){
 const m=String(t||'').replace(/\s+/g,'').match(/PROVISEUR-([A-Za-z0-9_-]+)-([0-9a-f]{4})/);
 if(!m)return{err:'Ce texte ne contient pas de code de lycée (il commence par PROVISEUR-).'};
 if(hash4(m[1])!==m[2])return{err:'Le code est incomplet ou abîmé : demandez à votre ami·e de le recopier en entier.'};
 if(m[1].length>12000)return{err:'Ce code est trop long pour être un code de lycée.'};
 try{let b=m[1].replace(/-/g,'+').replace(/_/g,'/');while(b.length%4)b+='=';const o=JSON.parse(decodeURIComponent(escape(atob(b))));const c=carteValide(o);return c?{carte:c}:{err:'Code illisible.'};}
 catch(e){return{err:'Code illisible.'};}
}
function ajouterAmi(c){
 if(!c)return'';if(c.uid===S.uid)return'C’est le code de votre propre lycée.';
 S.amis=(S.amis||[]).filter(a=>a.uid!==c.uid);c.recu=Date.now();S.amis.unshift(c);S.amis=S.amis.slice(0,12);
 log(`Code reçu : ${c.nom}${c.prov?' ('+c.prov+')':''} rejoint vos classements comme rival.`,'good');return'';
}
/* --- Adversaires réels : codes reçus + ligue en ligne --- */
function adversaires(){
 const m=new Map();for(const a of (S.amis||[]))m.set(a.uid,{...a,src:'code'});
 for(const a of NET.ligue)if(a.uid!==S.uid&&a.uid!==NET.uid){const o=m.get(a.uid);if(!o||a.maj>=o.maj)m.set(a.uid,{...a,src:'ligue'});}
 return[...m.values()];
}
function tauxPour(a,annee){const s=a.sais?.[annee];return s&&s.t!=null?s.t:a.taux;}
function rivauxReels(annee){
 const R0=REG().r,dep=[],nat=[];
 for(const a of adversaires()){const t=tauxPour(a,annee);if(t==null)continue;const r={nom:'★ '+a.nom,taux:t,ami:true,uid:a.uid};(a.reg===R0?dep:nat).push(r);}
 return{dep,nat};
}

 const manque=ids.filter(i=>!(i in NET.noms));if(!manque.length)return;try{const ps=await NET.user.profiles(manque);for(const i of manque)NET.noms[i]=propre(ps[i]?.name||'');rafraichirMulti();}catch(e){}}

   if(room){room.onPeers(ch=>{NET.peers=ch.peers.filter(p=>p.kind==='viewer');rafraichirMulti();},()=>{});}
   rafraichirMulti();return;}
  NET.etat='en-ligne';

  db.collection('ligue').limit(200).onSnapshot(s=>{NET.ligue=s.docs.map(d=>carteValide({...lire(d),uid:d.id})).filter(Boolean);resoudreNoms();rafraichirMulti();},()=>{});
  db.collection('defis').orderBy('cree','desc').limit(80).onSnapshot(s=>{
   const avant=new Set(NET.defis.map(x=>x.id));
   NET.defis=s.docs.map(d=>{const o=nettoyer(lire(d));return{id:d.id,de:propre(o.de),a:propre(o.a),critere:CRITERES[o.critere]?o.critere:'t',saison:+o.saison||0,statut:['lance','accepte','refuse'].includes(o.statut)?o.statut:'lance',deNom:propre(o.deNom).slice(0,60),aNom:propre(o.aNom).slice(0,60),mot:propre(o.mot).slice(0,140),cree:+o.cree||0};});
   for(const d of NET.defis)if(avant.size&&!avant.has(d.id)&&d.a===NET.uid)notif(`⚔️ ${d.deNom} vous lance un défi : ${CRITERES[d.critere][0]} ${d.saison}–${d.saison+1}`);
   verifierDefis();rafraichirMulti();},()=>{});
  db.collection('mur').orderBy('t','desc').limit(40).onSnapshot(s=>{
   const avant=new Set(NET.mur.map(x=>x.id));
   NET.mur=s.docs.map(d=>{const o=nettoyer(lire(d));return{id:d.id,by:propre(o.by),ecole:propre(o.ecole).slice(0,60),txt:propre(o.txt).slice(0,240),t:+o.t||0};});
   for(const m of NET.mur)if(avant.size&&!avant.has(m.id)&&m.by!==NET.uid&&UI.tab!=='multi')notif(`💬 ${m.ecole} : ${m.txt.slice(0,80)}`);
   resoudreNoms();rafraichirMulti();},()=>{});
  if(room){
   room.onPeers(ch=>{NET.peers=ch.peers.filter(p=>p.kind==='viewer');resoudreNoms();rafraichirMulti();},()=>{});
   room.on('bravo',m=>{const d=m.data&&typeof m.data==='object'?m.data:{};if(d.a===NET.uid&&!m.sameTab)notif(`👏 ${propre(d.ecole).slice(0,60)||'Un autre proviseur'} applaudit votre lycée !`);},()=>{});
   if(S)presenceMulti();
  }
  rafraichirMulti();
 }catch(e){console.warn('multijoueur',e);NET.etat='hors';NET.raison='erreur';NET.err=String(e&&e.message||e).slice(0,120);rafraichirMulti();}

/* --- Défis --- */
const CRITERES={t:['Taux de réussite global','%'],bac:['Réussite au Baccalauréat','%'],bepc:['Réussite au BEPC','%'],rep:['Réputation','pts'],eff:['Effectif','élèves']};
function valeurDefi(c,crit,saison){const s=c?.sais?.[saison];if(!s)return null;return s[crit]??null;}
function resultatDefi(d){
 const L=new Map(NET.ligue.map(x=>[x.uid,x]));const A=L.get(d.de),B=L.get(d.a);
 const va=valeurDefi(A,d.critere,d.saison),vb=valeurDefi(B,d.critere,d.saison);
 if(va==null||vb==null)return{fini:false,va,vb};
 return{fini:true,va,vb,gagnant:va>vb?d.de:vb>va?d.a:null};
}
function verifierDefis(){
 if(!S||!NET.uid)return;S.defisCredit=S.defisCredit||{};
 for(const d of NET.defis){if(d.statut!=='accepte'||S.defisCredit[d.id])continue;if(d.de!==NET.uid&&d.a!==NET.uid)continue;
  const r=resultatDefi(d);if(!r.fini)continue;S.defisCredit[d.id]=1;
  const adv=d.de===NET.uid?d.aNom:d.deNom;
  if(r.gagnant===NET.uid){rep(2);log(`Défi remporté contre ${adv} (${CRITERES[d.critere][0]}) : +2 de réputation.`,'good');notif(`🏆 Défi remporté contre ${adv} !`);}
  else if(r.gagnant){log(`Défi perdu contre ${adv} (${CRITERES[d.critere][0]}).`,'bad');}
  else log(`Défi nul contre ${adv} (${CRITERES[d.critere][0]}).`);}
 try{save();}catch(e){}
}

function renderDuel(m){
 const a=adversaires().find(x=>x.uid===m.uid);if(!a||!S)return'';const me=carteLycee();
 const lignes=[['Dernier taux de réussite',me.taux,a.taux,'%'],['Réputation',me.rep,a.rep,''],['Élèves',me.eff,a.eff,''],['Années à la tête du lycée',me.ans,a.ans,''],['Meilleur rang national',me.best,a.best,'',true]];
 let pm=0,pa=0;
 const barres=lignes.map(([l,x,y,u,inv])=>{
  if(x!=null&&y!=null&&x!==y)((inv?x<y:x>y)?pm++:pa++);
  const larg=v=>{if(v==null)return 0;if(inv){const mn=Math.min(x??Infinity,y??Infinity);return v?Math.round(100*mn/v):0;}return Math.round(pct(v,Math.max(1,x||0,y||0)));};
  const barre=(v,c)=>`<div class="mu-duel-b"><span class="mu-b" style="width:${larg(v)}%;background:${couleurOk(c)}"></span><b>${v??'—'}${v!=null?u:''}</b></div>`;
  return`<div class="mu-duel-l"><span class="small">${l}${inv?' (plus petit = meilleur)':''}</span>${barre(x,me.tn.b)}${barre(y,a.tn.b)}</div>`;}).join('');
 const ans=[...new Set([...Object.keys(me.sais),...Object.keys(a.sais)])].map(Number).sort((x,y)=>x-y);
 const verdict=pm>pa?`Avantage à <b>${esc(S.nom)}</b> (${pm} critères contre ${pa}).`:pa>pm?`Avantage à <b>${esc(a.nom)}</b> (${pa} critères contre ${pm}).`:'Égalité parfaite entre les deux établissements.';
 return form('Face-à-face',`${esc(S.nom)} contre ${esc(a.nom)}`,`<div class="mu-duel-tete"><div>${puceTenue(me.tn)} <b>${esc(S.nom)}</b><span class="small muted">${esc(me.reg)} · vous</span></div><div>${puceTenue(a.tn)} <b>${esc(a.nom)}</b><span class="small muted">${esc(a.reg)}${a.prov?' · '+esc(a.prov):''}${a.dev?' · « '+esc(a.dev)+' »':''}</span></div></div>
 ${barres}<p>${verdict}</p>
 ${ans.length?`<details><summary class="small">Année par année</summary><div class="scroll"><table class="tbl"><thead><tr><th>Session</th><th class="n">Vous</th><th class="n">${esc(a.nom.slice(0,18))}</th></tr></thead><tbody>${ans.map(y=>`<tr><td>${y+1}</td><td class="n">${me.sais[y]?.t!=null?Math.round(me.sais[y].t)+' %':'—'}</td><td class="n">${a.sais[y]?.t!=null?Math.round(a.sais[y].t)+' %':'—'}</td></tr>`).join('')}</tbody></table></div></details>`:''}
 <p class="small muted">Source : ${a.src==='ligue'?'ligue en ligne':'code reçu le '+new Date(a.recu||0).toLocaleDateString('fr-FR')}.</p>`,'<button class="btn primary" data-act="close-ui">Fermer</button>');
}
