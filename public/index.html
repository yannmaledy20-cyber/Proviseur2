/* ---------- Vie privée et salaire ---------- */
const SAL_BASE={public:385000,prive:560000};
const TRAINS={modeste:['Modeste',110000,-1],confort:['Confortable',230000,2],luxe:['Grand train',480000,4]};
const CATALOGUE={
 voiture:[{k:'moto',n:'Moto Yamaha 125',p:900000,ent:15000,pres:1,c:'#dc2626'},{k:'corolla',n:'Toyota Corolla d’occasion',p:3500000,ent:45000,pres:2,c:'#e5e7eb'},{k:'rav4',n:'Toyota RAV4',p:9500000,ent:70000,pres:4,c:'#1d4ed8'},{k:'tucson',n:'Hyundai Tucson neuf',p:15000000,ent:85000,pres:5,c:'#6b7280'},{k:'classec',n:'Mercedes Classe C',p:26000000,ent:140000,pres:7,c:'#111827'},{k:'v8',n:'Toyota Land Cruiser V8',p:46000000,ent:220000,pres:9,c:'#f8fafc'}],
 maison:[{k:'appart',n:'Appartement 2 chambres',p:12000000,ent:25000,pres:2,bon:3},{k:'duplex',n:'Duplex en quartier résidentiel',p:35000000,ent:60000,pres:5,bon:6},{k:'villa',n:'Villa avec jardin et piscine',p:75000000,ent:120000,pres:9,bon:10}],
 objet:[{k:'phone',n:'Smartphone dernier cri',p:350000,bon:4,pres:1},{k:'tv',n:'Télévision 65 pouces',p:550000,bon:5},{k:'pc',n:'Ordinateur portable (+1 point d’action par semaine)',p:450000,bon:2},{k:'costume',n:'Costume sur mesure en pagne',p:180000,bon:3,pres:1},{k:'groupe',n:'Groupe électrogène pour la maison',p:650000,bon:4},{k:'clim',n:'Climatiseur',p:400000,bon:4}],
 loisir:[{k:'resto',n:'Dîner au restaurant',p:35000,bon:6},{k:'match',n:'Match des Lions Indomptables au stade',p:25000,bon:7},{k:'concert',n:'Concert de makossa',p:20000,bon:6},{k:'spa',n:'Journée détente et massage',p:60000,bon:8},{k:'village',n:'Visite à la famille au village',p:90000,bon:10},{k:'kribi',n:'Week-end à la plage de Kribi',p:280000,bon:15}]
};
const CATS={voiture:'Voitures',maison:'Logement',objet:'Équipement',loisir:'Loisirs'};
function vie(){
 if(!S.vie)S.vie={argent:S.type==='prive'?700000:450000,salaire:SAL_BASE[S.type]||385000,train:'modeste',bonheur:60,maison:null,voitures:[],objets:[],releve:[],hist:[],dette:0,loisirs:{},repos:0,maire:0};
 const v=S.vie;v.voitures=Array.isArray(v.voitures)?v.voitures:[];v.objets=Array.isArray(v.objets)?v.objets:[];v.releve=Array.isArray(v.releve)?v.releve:[];v.hist=Array.isArray(v.hist)?v.hist:[];v.loisirs=v.loisirs&&typeof v.loisirs==='object'?v.loisirs:{};
 for(const k of ['argent','salaire','bonheur','dette'])if(!isFinite(+v[k]))v[k]=k==='bonheur'?60:k==='salaire'?SAL_BASE[S.type]||385000:0;
 if(!TRAINS[v.train])v.train='modeste';
 return v;
}
const semaineId=()=>S.annee*100+(S.semaine||0);
function mvtPerso(l,m){const v=vie();v.argent=Math.round(v.argent+m);v.releve.unshift({d:`${S.annee}–${S.annee+1} · ${S.semaine>=1&&S.semaine<=36?'Sem. '+S.semaine:PH().mois}`,l,m:Math.round(m)});if(v.releve.length>40)v.releve.length=40;}
const article=(cat,k)=>(CATALOGUE[cat]||[]).find(x=>x.k===k);
function meilleureVoiture(){const v=vie();let b=null;for(const k of v.voitures){const c=article('voiture',k);if(c&&(!b||c.p>b.p))b=c;}return b;}
function prestige(){const v=vie();let p=meilleureVoiture()?.pres||0;const m=article('maison',v.maison);if(m)p+=m.pres;for(const k of v.objets){const o=article('objet',k);if(o&&o.pres)p+=o.pres;}return p;}
function bonusPA(){const v=vie();return(v.bonheur>=80?1:v.bonheur<25?-1:0)+(v.objets.includes('pc')?1:0);}
function moisPerso(){
 const v=vie();mvtPerso('Salaire du mois',v.salaire);
 const T=TRAINS[v.train];mvtPerso(`Dépenses courantes (train de vie ${T[0].toLowerCase()})`,-T[1]);
 if(!v.maison)mvtPerso('Loyer de votre logement',-75000);
 let ent=0;for(const k of v.voitures){const c=article('voiture',k);if(c)ent+=c.ent;}const m=article('maison',v.maison);if(m)ent+=m.ent;
 if(ent)mvtPerso('Entretien de vos biens (carburant, réparations)',-ent);
 if(v.dette>0){const r=Math.min(v.dette,Math.max(60000,Math.round(v.dette/24)));v.dette-=r;mvtPerso('Remboursement de votre prêt bancaire',-r);}
 if(v.argent<0){mvtPerso('Agios bancaires (compte à découvert)',-Math.round(-v.argent*.03));v.bonheur-=4;}
 v.bonheur=clamp(v.bonheur+T[2]+(m?m.bon*.3:0)-(v.voitures.length?0:.5)+(60-v.bonheur)*.08,0,100);
 if(prestige()>=6){rez('maire',.6);rez('prefet',.4);}
}
function revisionSalaire(taux,attente,rangDep){
 const v=vie();const ancien=v.salaire;let sc=0;const mot=[];
 const vise=Math.round(35+S.reputation*.3);if(taux!=null){sc+=(taux-vise)/4;mot.push(`taux de réussite de ${Math.round(taux)} % pour ${vise} % attendus`);}if(rangDep!=null){const b=rangDep<=5?3:rangDep<=15?1.5:rangDep>35?-2:0;sc+=b;mot.push(`${rangDep}e au classement régional`);}
 const sup=S.type==='public'?S.rel.inspection:S.rel.parents;sc+=(sup-50)/7;mot.push(`satisfaction ${S.type==='public'?'de l’Inspection et du MINESEC':'du promoteur et des parents'} : ${Math.round(sup)}/100`);
 sc+=(S.integrite-60)/20;if(S.type==='prive'&&S.tresor>0){sc+=Math.min(3,S.tresor/1e7);mot.push('bonne santé financière du lycée');}if(S.tresor<0){sc-=3;mot.push('trésorerie du lycée dans le rouge');}
 const pv=clamp(Math.round(sc),-15,15);
 v.salaire=Math.max(Math.round(SAL_BASE[S.type]*.6/1000)*1000,Math.round(ancien*(1+pv/100)/1000)*1000);
 let prime=0;if(rangDep!=null&&rangDep<=3){prime=ancien;mvtPerso('Prime de rendement (top 3 régional)',prime);}
 v.hist.unshift({annee:S.annee,ancien,nouveau:v.salaire,pct:pv,prime});if(v.hist.length>30)v.hist.length=30;
 const txt=`${pv>0?'Augmentation':pv<0?'Baisse':'Maintien'} de votre salaire : ${money(ancien)} → ${money(v.salaire)} par mois (${pv>0?'+':''}${pv} %). Vos supérieurs ont regardé : ${mot.join(' ; ')}.${prime?` Vous touchez aussi une prime de rendement de ${money(prime)}.`:''}`;
 log(txt,pv>=0?'good':'bad');return txt;
}
/* Achats, ventes, loisirs, banque */
function acheter(cat,k){
 const v=vie(),a=article(cat,k);if(!a)return'Article inconnu.';
 if(cat==='voiture'&&v.voitures.includes(k))return'Vous possédez déjà ce véhicule.';
 if(cat==='maison'&&v.maison===k)return'C’est déjà votre maison.';
 if(cat==='objet'&&v.objets.includes(k))return'Vous l’avez déjà.';
 if(v.argent<a.p)return`Fonds insuffisants : il vous manque ${money(a.p-v.argent)}. Passez à la banque pour un prêt.`;
 mvtPerso(`Achat : ${a.n}`,-a.p);
 if(cat==='voiture')v.voitures.push(k);else if(cat==='maison'){if(v.maison){const o=article('maison',v.maison);mvtPerso(`Revente : ${o.n}`,Math.round(o.p*.85));}v.maison=k;}else v.objets.push(k);
 v.bonheur=clamp(v.bonheur+(a.bon||Math.min(8,2+a.p/5e6)),0,100);
 log(`Vie privée : vous achetez ${a.n.charAt(0).toLowerCase()+a.n.slice(1)} (${money(a.p)}).`,'good');
 if(a.pres>=5){rez('maire',2);rel('parents',1);}
 return`Félicitations ! ${a.n} est à vous.`;
}
function vendre(cat,k){
 const v=vie(),a=article(cat,k);if(!a)return'';const t=cat==='voiture'?.7:cat==='maison'?.85:.3;
 if(cat==='voiture'){if(!v.voitures.includes(k))return'';v.voitures=v.voitures.filter(x=>x!==k);}
 else if(cat==='maison'){if(v.maison!==k)return'';v.maison=null;}else{if(!v.objets.includes(k))return'';v.objets=v.objets.filter(x=>x!==k);}
 mvtPerso(`Revente : ${a.n}`,Math.round(a.p*t));v.bonheur=clamp(v.bonheur-3,0,100);return`Vendu pour ${money(Math.round(a.p*t))}.`;
}
function loisir(k){
 const v=vie(),a=article('loisir',k);if(!a)return'';
 if(v.loisirs[k]===semaineId())return'Vous en avez déjà profité cette semaine.';
 if(v.argent<a.p)return'Fonds insuffisants.';
 mvtPerso(`Loisir : ${a.n}`,-a.p);v.loisirs[k]=semaineId();v.bonheur=clamp(v.bonheur+a.bon,0,100);
 return`${a.n} : un bon moment ! Bonheur +${a.bon}.`;
}
function emprunter(m){const v=vie();const plafond=v.salaire*20;if(v.dette+m*1.2>plafond)return`Refusé : votre endettement dépasserait 20 mois de salaire (${money(plafond)}).`;v.dette+=Math.round(m*1.2);mvtPerso('Prêt bancaire',m);return`Prêt accordé : ${money(m)} sur votre compte, ${money(Math.round(m*1.2))} à rembourser en mensualités.`;}
function rembourser(){const v=vie();const r=Math.min(v.dette,Math.max(0,v.argent));if(!r)return'Rien à rembourser ou compte vide.';v.dette-=r;mvtPerso('Remboursement anticipé',-r);return`Vous remboursez ${money(r)}.`;}
function reposMaison(){const v=vie();if(v.repos===semaineId())return'Vous vous êtes déjà reposé·e cette semaine.';v.repos=semaineId();v.bonheur=clamp(v.bonheur+(article('maison',v.maison)?.bon||2)+v.objets.length*.5,0,100);return'Une soirée calme à la maison : vous rechargez vos batteries.';}
function visiteMaire(){const v=vie();if(v.maire===semaineId())return'Le maire vous a déjà reçu cette semaine.';v.maire=semaineId();const p=prestige();rez('maire',2+Math.min(4,p/2));return p>=6?'Le maire vous reçoit chaleureusement : votre réussite personnelle impressionne.':'Le maire vous reçoit entre deux rendez-vous.';}
function blocVie(cat,dansVille){

/* ---------- Difficulté des examens ---------- */
let _CHG=null;
function chargesProfs(){const m={},dm={};for(const d of S.divisions)dm[d.nom]=d.ids.length;for(const dn in S.affect)for(const s in S.affect[dn]){const id=S.affect[dn][s];if(id!=null)m[id]=(m[id]||0)+(dm[dn]||0);}return m;}
function sujetsSession(off){const k=S.annee+(off?'o':'b');if(!S.sujets||S.sujets.k!==k){const o={k,ex:{}};for(const ex of ORDRE_EX){const sj={};for(const s in MATIERES)sj[s]=gauss(0,.55);o.ex[ex]={g:gauss(-.2,.45),s:sj};}S.sujets=o;}return S.sujets;}
function penaliteCharge(e,s){let d=0;const id=S.affect[e.div]?.[s];if(id!=null&&_CHG){const n=_CHG[id]||0;if(n>220)d-=Math.min(1.4,(n-220)/170);}const div=S.divisions.find(x=>x.nom===e.div);if(div&&div.ids.length>50)d-=Math.min(1.5,(div.ids.length-50)*.03);return d;}
function difficulteExamen(e,s,off){const sj=sujetsSession(off).ex[EXAM_OF[e.level]];return penaliteCharge(e,s)+(sj?sj.g+(sj.s[s]||0):0);}
const compresser=n=>n>10.5?10.5+(n-10.5)*.62:n;
function logSujets(){const sj=sujetsSession(true);const L=[];for(const ex of ORDRE_EX){if(!S.resultats?.[ex])continue;const o=sj.ex[ex];let pire=null;for(const s in o.s)if(!pire||o.s[s]<o.s[pire])pire=s;L.push(`${ex} : ${o.g<-.3?'sujets jugés difficiles':o.g>.2?'sujets abordables':'sujets classiques'}${pire&&o.s[pire]<-.5?`, épreuve redoutée : ${MATIERES[pire]}`:''}`);}if(L.length)log(`Session ${S.annee+1} · ${L.join(' · ')}.`);}
function cardEncadrement(){
 const C=chargesProfs();const sur=S.profs.filter(p=>(C[p.id]||0)>220).sort((a,b)=>C[b.id]-C[a.id]);const pleth=S.divisions.filter(d=>d.ids.length>50);
 return`<div class="card stack ${sur.length||pleth.length?'t-amber':'t-green'}"><h3 style="margin:0">Taux d’encadrement</h3><p class="small">Au-delà de 220 élèves suivis par un enseignant, ou de 50 élèves par classe, les copies sont moins bien corrigées et les notes baissent, aux séquences comme aux examens.</p>

}

/* ---------- Plan libre du campus ---------- */
const LOTS=[{id:'L1',nom:'Parcelle sud-ouest',type:'grand',x0:-34,z0:24},{id:'L2',nom:'Parcelle sud-est',type:'grand',x0:4,z0:24},{id:'L3',nom:'Parcelle ouest',type:'cote',side:'W'},{id:'L4',nom:'Parcelle est',type:'cote',side:'E'}];
const FORMES={vide:{l:'Terrain libre',grand:0,cote:0,max:0},pavillons:{l:'Pavillons de plain-pied',grand:3,cote:4,max:1},barre:{l:'Bâtiment en barre',grand:3,cote:4,max:4},L:{l:'Bâtiment en L',grand:4,max:4},U:{l:'Bâtiment en U',grand:5,max:4}};
const formesLot=lot=>Object.keys(FORMES).filter(f=>FORMES[f][lot.type]!=null);
function sallesParEtage(l){const lot=LOTS.find(x=>x.id===l.id);return lot?(FORMES[l.forme]?.[lot.type]||0):0;}
function etagesLot(l){return Math.max(0,Math.min(l.etages||1,FORMES[l.forme]?.max||0));}
function capacitePlan(p){return sum((p?.lots||[]).map(l=>sallesParEtage(l)*etagesLot(l)));}
const prixSalle=f=>Math.round(coutBat(BATIMENTS.find(b=>b.id==='salle'))*(1+.18*f));
function coutPlan(nv,anc){let c=0,n=0;for(const l of nv.lots){const o=anc?.lots.find(x=>x.id===l.id)||{forme:'vide',etages:0};const a=sallesParEtage(l),b=o.forme===l.forme||(o.forme==='barre'&&l.forme!=='pavillons')?sallesParEtage(o):0;for(let f=0;f<etagesLot(l);f++){const ex=f<etagesLot(o)?b:0;const add=Math.max(0,a-ex);n+=add;c+=add*prixSalle(f);}}
 const cr=Math.min(n,S.campus?.credit||0);if(n)c=Math.round(c*(n-cr)/n);return{cout:c,nouvelles:n,credit:cr};}
function planDefaut(){const p={mode:'libre',lots:LOTS.map(l=>({id:l.id,forme:'vide',etages:1})),credit:0};const ordre=['L1','L2','L3','L4'];let i=0;
 while(capacitePlan(p)<S.bat.salles&&i<40){const l=p.lots.find(x=>x.id===ordre[i%4]);if(l.forme==='vide'){l.forme='barre';l.etages=1;}else if(l.etages<4)l.etages++;i++;}return p;}
function geomLot(l){
 const lot=LOTS.find(x=>x.id===l.id);const F=l.forme;const R0=[],G=[];let E=null;if(!lot)return{rooms:R0,gal:G,esc:E};
 if(lot.type==='grand'){const X=lot.x0,Z=lot.z0;
  if(F==='pavillons'){for(let k=0;k<3;k++)R0.push({x0:X+.3+k*10,z0:Z+2,w:9.4,d:8,porte:'N'});}
  else if(F==='barre'){for(let k=0;k<3;k++)R0.push({x0:X+k*9,z0:Z+2,w:9,d:8,porte:'N'});G.push({a:X,b:X+30,c:Z,d:Z+2,o:'N'});E={a:X+27,b:X+30,c:Z+2,d:Z+6,lx:X+28.5,lz:Z+1};}
  else if(F==='L'){for(let k=0;k<2;k++)R0.push({x0:X+3+k*9,z0:Z+2,w:9,d:8,porte:'N'});R0.push({x0:X+23,z0:Z+2,w:7,d:9,porte:'W'},{x0:X+23,z0:Z+11,w:7,d:9,porte:'W'});G.push({a:X,b:X+23,c:Z,d:Z+2,o:'N'},{a:X+21,b:X+23,c:Z+2,d:Z+20,o:'W'});E={a:X,b:X+3,c:Z+2,d:Z+6,lx:X+1.5,lz:Z+1};}
  else if(F==='U'){R0.push({x0:X,z0:Z+2,w:8,d:9,porte:'E'},{x0:X,z0:Z+11,w:8,d:9,porte:'E'},{x0:X+22,z0:Z+2,w:8,d:9,porte:'W'},{x0:X+22,z0:Z+11,w:8,d:9,porte:'W'},{x0:X+10,z0:Z+12,w:10,d:8,porte:'N'});G.push({a:X,b:X+30,c:Z,d:Z+2,o:'N'},{a:X+8,b:X+10,c:Z+2,d:Z+20,o:'E'},{a:X+20,b:X+22,c:Z+2,d:Z+20,o:'W'},{a:X+10,b:X+20,c:Z+10,d:Z+12,o:'N'});E={a:X+13,b:X+17,c:Z+2,d:Z+5,lx:X+15,lz:Z+1};}
 }else{const W=lot.side==='W';const xr=W?-51:43,xg=W?-43:41;
  if(F==='pavillons'||F==='barre')for(let k=0;k<4;k++)R0.push({x0:xr,z0:-19+k*9.2,w:8,d:9,porte:W?'E':'W'});
  if(F==='barre'){G.push({a:xg,b:xg+2,c:-22,d:20,o:W?'E':'W'});E={a:W?-46:41,b:W?-41:46,c:-22,d:-19,lx:xg+1,lz:-18};}}
 return{rooms:R0,gal:G,esc:E};
}
function svgPlan(p){
 const sx=x=>(x+56)*4,sz=z=>(z+30)*4;let s='';
 s+=`<rect x="${sx(-52)}" y="${sz(-26)}" width="${104*4}" height="${78*4}" rx="10" fill="var(--soft)" stroke="var(--line)"/>`;
 s+=`<rect x="${sx(-33)}" y="${sz(-20)}" width="${66*4}" height="${40*4}" rx="6" fill="color-mix(in srgb,var(--muted) 12%,transparent)"/><text x="${sx(0)}" y="${sz(0)}" text-anchor="middle" font-size="13" fill="var(--muted)">Cour de récréation</text>`;
 s+=`<text x="${sx(0)}" y="${sz(51)}" text-anchor="middle" font-size="12" fill="var(--muted)">Portail · rue</text>`;
 for(const l of p.lots){const lot=LOTS.find(x=>x.id===l.id);const box=lot.type==='grand'?[lot.x0,lot.z0,30,20]:[lot.side==='W'?-51:41,-22,10,42];
  s+=`<rect x="${sx(box[0])}" y="${sz(box[1])}" width="${box[2]*4}" height="${box[3]*4}" rx="4" fill="none" stroke="var(--accent)" stroke-dasharray="5 4"/>`;
  const g=geomLot(l);const n=etagesLot(l);
  for(const ga of g.gal)s+=`<rect x="${sx(ga.a)}" y="${sz(ga.c)}" width="${(ga.b-ga.a)*4}" height="${(ga.d-ga.c)*4}" fill="color-mix(in srgb,var(--accent) 30%,transparent)"/>`;
  for(const r of g.rooms)s+=`<rect x="${sx(r.x0)}" y="${sz(r.z0)}" width="${r.w*4}" height="${r.d*4}" rx="2" fill="${S.tenue?.chemise||'#bfdbfe'}" stroke="${S.tenue?.bas||'#1e3a8a'}" stroke-width="2"/>`;
  if(g.esc)s+=`<rect x="${sx(g.esc.a)}" y="${sz(g.esc.c)}" width="${(g.esc.b-g.esc.a)*4}" height="${(g.esc.d-g.esc.c)*4}" fill="#64748b"/>`;
  const cx=box[0]+box[2]/2,cz=box[1]+box[3]/2;s+=`<text x="${sx(cx)}" y="${sz(cz)+4}" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ink)" ${lot.type==='cote'?`transform="rotate(-90 ${sx(cx)} ${sz(cz)})"`:''} paint-order="stroke" stroke="var(--sheet)" stroke-width="3">${l.forme==='vide'?esc(lot.nom):`${n} niv. · ${sallesParEtage(l)*n} salles`}</text>`;}
 return`<svg viewBox="0 0 ${112*4} ${86*4}" width="100%" style="max-width:640px" role="img" aria-label="Plan du campus">${s}</svg>`;
}

/* Résolution adaptative : moins de pixels si l'appareil peine, plus net quand c'est fluide */
function realResolution(renderer){realResolutionC(renderer,V3.anims);}
function realResolutionC(renderer,anims){

 anims.push(()=>{const now=performance.now(),d=now-last;last=now;if(document.hidden||d>400)return;somme+=d;n++;if(somme<2000)return;const moy=somme/n;somme=0;n=0;

 'demande':()=>{if(S.actions.demande)return;S.actions.demande=true;S.actions.fav.inspection=true;const c=couverture();const manque=Object.entries(c.by).filter(([,o])=>o.cov<o.need).sort((a,b)=>(b[1].need-b[1].cov)-(a[1].need-a[1].cov)).map(([s])=>s);

document.addEventListener('change',ev=>{
 const t=ev.target;const k=t.dataset.in;if(!k||!S)return;
 if(k==='frais'){S.frais=clamp(Math.round(+t.value/500)*500,S.type==='public'?5000:30000,S.type==='public'?40000:300000);save();if(!S.pending)render();else t.value=S.frais;}
 if(k==='taille'){S.tailleMax=clamp(+t.value||50,25,120);save();render();}
 if(k==='soutien'){S.soutien=t.checked;save();render();}
 if(k==='bud'){S.budget[t.dataset.k]=clamp(Math.round(+t.value/5000)*5000||0,0,500000);t.value=S.budget[t.dataset.k];save();if(!S.pending)render();}
 if(k==='harmo'){S.harmo=t.checked;save();render();}
 if(k==='or-sel'){const r=S.pending?.groupes?.flatMap(g=>g.rows).find(x=>x.id===+t.dataset.id);if(r){r.choix=t.value;save();render();}}
 if(k==='projet'){const kk=t.dataset.k;S.projet=S.projet.filter(x=>x!==kk);if(t.checked){S.projet.push(kk);if(S.projet.length>2){const old=S.projet.shift();const b=document.getElementById('pj-'+old);if(b)b.checked=false;}}save();}
 if(k==='bareme'){S.bareme=t.value;log(`Barème de notation : ${BAREMES[t.value][0].toLowerCase()}.`);save();render();}
 if(k==='parrain'){S.parrainage=t.checked;save();render();}
 if(k==='retenues'){S.retenues=t.checked;save();render();}
 if(k==='eds'){S.eleveSemaine=t.checked;save();render();}
 if(k==='mascotte'){const nouv=!S.mascotte&&t.value;S.mascotte=t.value||null;if(nouv){humeurAll(5);log(`Les élèves adoptent leur mascotte : ${MASCOTTES[t.value]} !`,'good');}save();render();}
 if(k==='devise'){S.devise=propre(t.value).slice(0,60);save();render();}
 if(k==='appr'){const e=S.eleves.find(x=>x.id===+t.dataset.id);if(e&&t.value)apprecier(e,+t.dataset.t,propre(t.value));}
 if(k==='repet'){S.repetitions=t.checked;log(t.checked?'Cours de répétition payants autorisés.':'Cours de répétition payants supprimés.');save();render();}
 if(k==='club'){S.clubs[t.dataset.k]=t.checked;log(`${CLUBS.find(c=>c.k===t.dataset.k).nom} : ${t.checked?'ouverture':'fermeture'}.`);save();render();}
 if(k==='hebdo'){S.hebdo[t.dataset.k]=t.value;save();}

   <div class="pool"><b>Projet d’établissement de l’année</b><p class="small muted">Choisissez jusqu’à deux priorités. Elles s’appliquent toute l’année.</p><div class="projets">${PROJETS.map(x=>`<label class="opt" for="pj-${x.k}"><input type="checkbox" id="pj-${x.k}" data-in="projet" data-k="${x.k}" ${S.projet.includes(x.k)?'checked':''}><span>${x.l}<small>${x.d}</small></span></label>`).join('')}</div></div>
   <p class="note" id="adm-tot">${admTotal()}</p>
   <p class="small muted">Plus vous admettez d’élèves, plus les recettes augmentent, mais les classes pléthoriques font baisser les notes. Admettre seulement les meilleurs au concours élève le niveau.</p>`,
  `<button class="btn primary" data-act="conf-adm">Soumettre au vote et valider</button>`).replace(/<div id="adm-(\d+)" class="small"><\/div>/g,(m,i)=>{const pool=p.pools[+i];const last=pool.cands[pool.n-1];return`<div id="adm-${i}" class="small"><b>${pool.n}</b> admis${pool.n?` · dernier admis : <span class="num">${f2(last.concours)}</span>/20 au concours`:''}</div>`;});
 }
 if(p.type==='conseil'){
  const t=p.t;const fin=t===2;const c=fin?decisions(S.seuil,false):null;
  return form(`Conseil de classe · ${fin?'fin d’année':(t+1)+(t?'e':'er')+' trimestre'}`,fin?'Moyennes annuelles et décisions':'Résultats du trimestre',
  `<div class="scroll"><table class="tbl"><thead><tr><th>Classe</th><th class="n">Eff.</th><th class="n">Moy. classe</th><th class="n">≥ 10</th><th>Major</th><th class="n">TH et +</th><th class="n">Fél.</th><th class="n">Avert./Blâme</th></tr></thead><tbody>
  ${p.rows.map(r=>`<tr><td>${r.nom}</td><td class="n">${r.eff}</td><td class="n ${nCls(r.moy)}">${f2(r.moy)}</td><td class="n">${Math.round(r.taux)} %</td><td class="small">${esc(r.major)}</td><td class="n">${r.th}</td><td class="n">${r.fel}</td><td class="n">${r.avert}</td></tr>`).join('')}</tbody></table></div>
  ${fin?`<div class="pool"><label for="seuil" class="small"><b>Moyenne annuelle exigée pour passer en classe supérieure : <span id="seuil-v" class="num">${f2(S.seuil)}</span>/20</b></label><input id="seuil" type="range" min="8.5" max="11" step="0.25" value="${S.seuil}" data-in="seuil"><div id="seuil-c" class="small">${c.admis} admis · ${c.redouble} redoublants · ${c.exclu} exclus · ${c.vote} cas de triplement soumis au vote · ${c.examen} candidats aux examens</div>
  <p class="small muted">Sous le seuil, l’élève redouble. Sous 7 de moyenne, l’exclusion est automatique. Un élève qui échoue après avoir déjà redoublé passe devant le conseil des professeurs, qui vote son exclusion ou l’autorise à tripler. Un seuil sous 9,5 déplaît à l’Inspection ; au-dessus de 10,25, les parents protestent. Les classes d’examen passent selon leur résultat à l’examen.</p></div>`:'<p class="small muted">Les bulletins individuels sont dans l’onglet Classes.</p>'}`,
  fin?`<button class="btn primary" data-act="conf-conseil">Arrêter les décisions</button>`:`${btnRattrapage(t)}<button class="btn primary" data-act="close-pending">Clore le conseil</button>`);
 }
 if(p.type==='blanc'){
  const nDiv=S.divisions.filter(d=>isExam(d.level)).length;
  const ks=ORDRE_EX.filter(x=>S.blancs[x]);
  return form('Juin','Résultats des examens blancs',
  ks.length?`<div class="statgrid">${ks.map(x=>`<div class="stat"><span class="eyebrow">${x}</span><b>${Math.round(pct(S.blancs[x].admis,S.blancs[x].candidats))} %</b><span class="small muted">${S.blancs[x].admis}/${S.blancs[x].candidats} au-dessus de 10</span></div>`).join('')}</div>
  <p class="small muted">Ces résultats donnent une idée des chances de vos candidats. Vous pouvez encore les préparer.</p>
  <label class="row" for="prep1"><input id="prep1" type="checkbox" data-in="prep-soutien" ${S.prep.soutien?'checked':''}> Cours de soutien intensifs pour les ${nDiv} classes d’examen (${money(75000*nDiv)}) : environ +0,6 point</label>
  <label class="row" for="prep2"><input id="prep2" type="checkbox" data-in="prep-sensib" ${S.prep.sensib?'checked':''}> Campagne de sensibilisation contre la fraude (${money(60000)}) : moins de candidats exclus pour fraude</label>`:'<p>Aucune classe d’examen cette année.</p>',
  `<button class="btn primary" data-act="conf-prep">Valider</button>`);
 }
 if(p.type==='examens'){
  const ks=ORDRE_EX.filter(x=>S.resultats[x]);const nr=nbRecours();
  return form(`Session ${S.annee+1}`,'Résultats des examens officiels',
  `${p.scandale?'<p class="rouge"><b>Scandale :</b> l’achat des épreuves a été révélé. Amende de 1 000 000 FCFA, réputation et relations avec le MINESEC en chute libre.</p>':''}
  ${p.fuite==='fausse'?'<p class="small muted">Les « sujets » achetés étaient des faux.</p>':''}
  ${ks.length?`<div class="scroll"><table class="tbl"><thead><tr><th>Examen</th><th class="n">Candidats</th><th class="n">Admis</th><th class="n">Taux</th><th class="n">Mentions B, TB, Exc.</th><th class="n">Fraudes</th></tr></thead><tbody>
  ${ks.map(x=>{const o=S.resultats[x];return`<tr><td>${x}</td><td class="n">${o.candidats}</td><td class="n">${o.admis}</td><td class="n"><b>${Math.round(pct(o.admis,o.candidats))} %</b></td><td class="n">${(o.mentions.Bien||0)+(o.mentions['Très Bien']||0)+(o.mentions.Excellent||0)}</td><td class="n">${o.fraudes||''}</td></tr>`;}).join('')}</tbody></table></div>
  ${ks.map(x=>{const o=S.resultats[x];const top=o.liste.filter(c=>c.admis).slice(0,3);return top.length?`<p class="small"><b>Majors ${x} :</b> ${top.map(c=>`${esc(c.nom)} (${f2(c.moy)}, ${c.mention})`).join(' · ')}</p>`:'';}).join('')}
  <div class="pool"><b>Recours</b>${S.recoursFait?`<p class="small">${esc(S.recoursMsg)}</p>`:nr?`<p class="small">${nr} candidat(s) ont échoué avec une moyenne entre 9,5 et 10. Vous pouvez déposer un recours pour chacun (10 000 FCFA de frais de dossier). Environ un tiers aboutissent.</p><div><button class="btn" data-act="recours">Déposer ${nr} recours · ${money(10000*nr)}</button></div>`:'<p class="small muted">Aucun candidat n’est éligible à un recours.</p>'}</div>`:'<p>Aucun candidat cette année.</p>'}`,
  `<button class="btn" data-act="c3d" data-k="resultats">Proclamation en 3D</button><button class="btn primary" data-act="conf-exam">Clore la session</button>`);
 }
 if(p.type==='bilan'){
  const c=S.classement;
  return form(`Fin de l’année ${S.annee}–${S.annee+1}`,'Bilan de l’année',
  `<div class="statgrid"><div class="stat"><span class="eyebrow">Réussite globale</span><b>${p0(p.taux)}</b></div><div class="stat"><span class="eyebrow">Attentes des parents</span><b>${p.attente!=null?p.attente+' %':'—'}</b></div><div class="stat"><span class="eyebrow">Rang régional</span><b>${c.rangDep??'—'} / ${c.totalDep}</b></div><div class="stat"><span class="eyebrow">Rang national</span><b>${c.rangReg??'—'} / ${c.totalReg}</b></div><div class="stat"><span class="eyebrow">Réputation</span><b>${Math.round(S.reputation)} <span class="small ${p.dr>=0?'vert':'rouge'}">${p.dr>=0?'+':''}${p.dr.toFixed(1).replace('.',',')}</span></b></div>
  <div class="stat"><span class="eyebrow">Recettes</span><b>${moneyS(p.recettes)}</b></div><div class="stat"><span class="eyebrow">Dépenses</span><b>${moneyS(p.depenses)}</b></div><div class="stat"><span class="eyebrow">Trésorerie</span><b class="${S.tresor<0?'rouge':''}">${moneyS(S.tresor)}</b></div><div class="stat"><span class="eyebrow">Cours assurés</span><b>${Math.round(p.cov*100)} %</b></div></div>
  ${p.promo&&!S.over&&!S.retraite?`<div class="pool" style="background:var(--t-green)"><b>Proposition de mutation</b><p class="small">Vos résultats ont été remarqués. Le Ministre vous propose de prendre la direction du <b>${esc(p.promo.nom)}</b> (région ${esc(REGIONS[p.promo.reg].r)}), un établissement plus grand et plus prestigieux. Vous gardez votre intégrité, vos trophées, vos anciens élèves et votre ancienneté.</p><div><button class="btn primary" data-act="promo-ok">Accepter la mutation</button></div><p class="small muted">Pour refuser, commencez simplement l’année suivante ici.</p></div>`:''}${S.avert&&!S.over?`<div class="note"><b>Avertissement du Ministère :</b> la réussite globale est sous ${SEUIL_RENVOI} %. Une deuxième année sous ce seuil entraînera votre renvoi.</div>`:''}${p.atteints.length?`<div class="pool"><b>Objectifs atteints</b>${p.atteints.map(t=>`<p class="small vert">✓ ${t}</p>`).join('')}</div>`:''}
  <p class="small muted">Plus votre réputation est haute, plus les parents en attendent : un taux sous leurs attentes fait baisser la réputation.${S.hist.length>=4?' À partir de la 5e année, vous pouvez terminer votre mandat et découvrir votre bilan de carrière.':''}</p>
  <p class="small muted">Pendant les vacances : les admis passent en classe supérieure, les bacheliers quittent l’établissement, ${S.type==='public'?'le MINESEC procède aux mutations et affectations.':'certains enseignants démotivés peuvent démissionner.'}</p>`,
  `${anneesCarriere()>=5&&!S.over&&!S.retraite?'<button class="btn" data-act="fin-mandat">Prendre ma retraite</button>':''}<button class="btn primary" data-act="conf-bilan">${S.over?'Voir la suite':S.retraite?'Partir à la retraite':`Commencer l’année ${S.annee+1}–${S.annee+2}`}</button>`);
 }
 if(p.type==='event'){
  const ev=EVENTS.find(e=>e.id===p.id);
  if(!ev) return form('Événement','—','','<button class="btn" data-act="close-pending">Fermer</button>');
  return form('Événement',ev.titre,`<div class="illus">${illus(EV_IMG[ev.id]||'ecole')}</div><p>${esc(ev.texte(p.c))}</p><div class="choice">${ev.choix(p.c).map((ch,i)=>`<button class="btn" data-act="ev" data-i="${i}">${esc(ch.l)}</button>`).join('')}</div>`,'');
 }
 if(p.type==='triples') return renderTriples(p);
 if(p.type==='orientation') return renderOrientation(p);
 if(p.type==='honneur') return renderHonneur(p);
 if(p.type==='discipline'){const c=CAS.find(x=>x.id===p.cas);
  return form('Conseil de discipline',`${esc(p.nom)} · ${esc(p.div||'')}`,
  `<p><b>${c.t}.</b> ${c.faits}</p>
  ${p.qui?`<p class="note">Son parent, ${QUI[p.qui]}, a appelé ce matin « pour prendre des nouvelles ». Une sanction lourde le fâchera.</p>`:''}
  <p class="small">Gravité apparente : <b>${GRAV[c.g]}</b>. Vous avez le temps d’entendre deux témoins sur trois.</p>
  <div class="stack" style="gap:6px">${c.tem.map((w,i)=>p.heard.includes(i)?`<div class="wit"><b>${w.q} :</b> « ${esc(p.tw&&w.rt?w.rt:w.r)} »</div>`:`<button class="btn" data-act="disc-hear" data-i="${i}" ${p.heard.length>=2?'disabled':''}>Entendre : ${w.q.toLowerCase()}</button>`).join('')}</div>
  <div class="choice"><span class="small" style="font-weight:600">Sanction</span>${SANC.map((x,i)=>`<button class="btn" data-act="disc-sanc" data-s="${i}">${x}</button>`).join('')}</div>`,'');}
 if(p.type==='fig'){const e=S.eleves.find(x=>x.id===p.id);
  if(!e) return form('Élève à suivre','Élève parti','<p>Cet élève a quitté l’établissement.</p>','<button class="btn" data-act="close-pending">Fermer</button>');
  const F=FIGEV[e.fig.t];
  return form(`Élève à suivre · ${FIG[e.fig.t].l}`,F.titre(e),`<div class="fig"><span class="av" style="background:${FIG[e.fig.t].c}">${initiales(e.nom)}</span><span class="fig-t"><b>${esc(e.nom)}</b><span class="small muted">${e.div} · ${e.age} ans · ${FIG[e.fig.t].txt}</span></span></div><p>${esc(F.texte(e))}</p><div class="choice">${F.choix(e).map((c,i)=>`<button class="btn" data-act="figch" data-i="${i}">${esc(c.l)}</button>`).join('')}</div>`,'');}
 if(p.type==='fin') return form('Fin de mandat',p.t,`<p>${esc(p.d)}</p><div class="statgrid"><div class="stat"><span class="eyebrow">Années de carrière</span><b>${anneesCarriere()}</b></div><div class="stat"><span class="eyebrow">Établissements dirigés</span><b>${(S.carriere||[]).length+1}</b></div><div class="stat"><span class="eyebrow">Meilleur rang régional</span><b>${p.best<99?p.best:'—'}</b></div><div class="stat"><span class="eyebrow">Intégrité</span><b>${Math.round(S.integrite)}/100</b></div><div class="stat"><span class="eyebrow">Anciens élèves suivis</span><b>${S.alumni.length}</b></div></div>`,'<button class="btn" data-act="close-pending">Revoir l’établissement</button><button class="btn primary" data-act="new-ok">Nouvelle partie</button>');
 if(p.type==='msg') return form('Événement',p.titre,`${p.img?`<div class="illus">${illus(p.img)}</div>`:''}${p.img==='defile'?'<div class="row"><button class="btn primary" data-act="c3d" data-k="defile">Revoir le défilé en 3D</button></div>':''}<p>${p.html}</p>`,'<button class="btn primary" data-act="close-pending">Continuer</button>');
 if(p.type==='gameover') return form('Fin de partie','Votre mandat s’arrête ici',`<p>${esc(p.txt)}</p><p class="small muted">Années à la tête de l’établissement : ${S.hist.length}. Meilleur rang régional : ${Math.min(...S.hist.map(h=>h.rangDep??99))===99?'—':Math.min(...S.hist.map(h=>h.rangDep??99))}.</p>`,'<button class="btn" data-act="close-pending">Voir l’établissement</button><button class="btn primary" data-act="new-ok">Nouvelle partie</button>');
 return'';
}
function renderBulletin(m){
 const e=S.eleves.find(x=>x.id===m.id);if(!e)return'';
 if(m.vue==='parcours') return renderParcours(m,e);
 if(m.vue==='entretien') return renderEntretien(m,e);
 if(m.vue==='copies') return renderCopies(m,e);
 const t=m.t;const key=gkey(e.level,e.serie);const coefs=coefsOf(key);const pm=profMap();
 const d=S.divisions.find(x=>x.nom===e.div);
 const em=new Map(S.eleves.map(x=>[x.id,x]));
 const classe=d?d.ids.map(i=>em.get(i)?.trim[t]).filter(x=>x!=null):[];
 let tot=0,tc=0;
 const rows=Object.entries(coefs).map(([s,c])=>{
  const a=e.notes[2*t][s],b=e.notes[2*t+1][s];const mm=a!=null&&b!=null?(a+b)/2:(a??b);
  if(mm!=null){tot+=mm*c;tc+=c;}
  const p=pm[S.affect[e.div]?.[s]];
  return`<tr><td>${MATIERES[s]}</td><td class="n ${nCls(a)}">${a!=null?f2(a):'—'}</td><td class="n ${nCls(b)}">${b!=null?f2(b):'—'}</td><td class="n ${nCls(mm)}"><b>${f2(mm)}</b></td><td class="n">${c}</td><td class="n">${mm!=null?f2(mm*c):'—'}</td><td class="small">${p?esc(p.nom):'—'}</td><td class="small">${appreciation(mm)}</td><td>${sparkNotes(e,s)}</td></tr>`;
 }).join('');
 const moy=tc?tot/tc:null;
 const off=e.trim[t]!=null;
 const body=ficheTabs(m)+`<div class="bulhead"><div>République du Cameroun<br><span class="devise">Paix – Travail – Patrie</span><br>Ministère des Enseignements secondaires</div><div>${esc(S.nom)}<br>${esc(REG().v)}<br>Année scolaire ${S.annee}–${S.annee+1}</div></div>
 <div class="row between small"><span><b>${esc(e.nom)}</b> · ${e.sexe==='F'?'Née':'Né'} il y a ${e.age} ans · ${e.redouble?'Redoublant·e':'Nouveau·elle'}</span><span>Classe : <b>${e.div}</b> · Effectif : ${d?.ids.length||'—'}</span></div>
 <div class="row">${[0,1,2].map(i=>`<button class="btn sm ${i===t?'primary':''}" data-act="bul-t" data-t="${i}">${i+1}${i?'e':'er'} trimestre</button>`).join('')}</div>
 <div class="scroll"><table class="tbl"><thead><tr><th>Matière</th><th class="n">Séq.${2*t+1}</th><th class="n">Séq.${2*t+2}</th><th class="n">Moy./20</th><th class="n">Coef.</th><th class="n">Moy.×coef.</th><th>Enseignant</th><th>Appréciation</th><th>Évolution</th></tr></thead><tbody>${rows}</tbody>
 <tfoot><tr><td>Total</td><td></td><td></td><td></td><td class="n">${tc}</td><td class="n">${f2(tot)}</td><td colspan="3"></td></tr></tfoot></table></div>
 <div class="statgrid"><div class="stat"><span class="eyebrow">Moyenne du trimestre</span><b class="${nCls(moy)}">${f2(moy)}</b>${off?'':'<span class="small muted">provisoire</span>'}</div><div class="stat"><span class="eyebrow">Rang</span><b>${off&&e.rangs[t]?e.rangs[t]+(e.rangs[t]===1?'er':'e')+' / '+(d?.ids.length||''):'—'}</b></div><div class="stat"><span class="eyebrow">Moyenne de la classe</span><b>${f2(avg(classe))}</b></div><div class="stat"><span class="eyebrow">Absences (année)</span><b>${e.abs} h</b></div></div>
 ${apprBloc(e,t)}<p class="small">${off&&dist(moy)?`<b>Conseil de classe :</b> ${dist(moy)}. `:''}${t===2&&e.annuelle!=null?`<b>Moyenne annuelle :</b> ${f2(e.annuelle)}. `:''}${e.decision==='admis'?'<b>Décision :</b> admis·e en classe supérieure.':e.decision==='redouble'?'<b>Décision :</b> redouble.':e.decision==='exclu'?'<b>Décision :</b> exclu·e.':''}${e.examen?` <b>${EXAM_OF[e.level]} :</b> ${e.examen.fraude?'exclu·e pour fraude':e.examen.admis?'admis·e, mention '+e.examen.mention:'échec'} (${f2(e.examen.moy)}).`:''}</p>`;
 return form(`Fiche élève · bulletin du ${t+1}${t?'e':'er'} trimestre`,esc(e.nom),body,'<button class="btn primary" data-act="close-ui">Fermer</button>');
}

/* ================= Sauvegarde et démarrage ================= */
const KEY='proviseur-cm-v1';
function save(){try{checkSucces();}catch(e){}try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){alleger();try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e2){}}}
function load(){try{const t=localStorage.getItem(KEY);if(t){const o=JSON.parse(t);if(o&&o.eleves)return migrer(o);}}catch(e){}return null;}
function start(data){
 if(data&&data.S){S=migrer(data.S);UI=data.UI||UI;}else{S=load();UI.ecran='menu';UI.mv='accueil';}
 render();try{initReseau();}catch(e){}
}
try{if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});}catch(e){}
window.claude?.hot?.snapshot?.(()=>({S,UI}));
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>
